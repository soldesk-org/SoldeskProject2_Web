name: Notion PR 개발일지 자동 작성

on:
  pull_request:
    types:
      - closed
    branches:
      - develop

  # 오류 확인이나 수동 테스트를 위해 유지
  workflow_dispatch:

jobs:
  create-notion-development-log:
    # 단순히 닫힌 PR은 제외하고, 병합된 PR만 자동 기록
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Notion 개발일지 작성
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
        run: |
          python <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          token = os.environ["NOTION_TOKEN"]
          data_source_id = os.environ["NOTION_DATA_SOURCE_ID"]
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")

          with open(os.environ["GITHUB_EVENT_PATH"], "r", encoding="utf-8") as file:
              event = json.load(file)

          # Actions 화면에서 수동 실행한 경우
          if event_name == "workflow_dispatch":
              log = {
                  "title": "[Web] PR 자동화 수동 테스트",
                  "date": datetime.now(timezone.utc).isoformat(),
                  "repository": "Web",
                  "author": os.environ.get("GITHUB_ACTOR", "수동 실행"),
                  "branch": os.environ.get("GITHUB_REF_NAME", "develop"),
                  "pr_number": 0,
                  "pr_url": (
                      "https://github.com/"
                      + os.environ.get("GITHUB_REPOSITORY", "")
                      + "/actions"
                  ),
                  "status": "테스트",
              }

          # develop에 실제 병합된 PR인 경우
          else:
              pr = event["pull_request"]

              if not pr.get("merged"):
                  raise SystemExit("병합되지 않은 PR이므로 기록하지 않습니다.")

              log = {
                  "title": f"[Web] #{pr['number']} {pr['title']}",
                  "date": pr.get("merged_at")
                          or datetime.now(timezone.utc).isoformat(),
                  "repository": "Web",
                  "author": pr.get("user", {}).get(
                      "login",
                      "작업자 확인 필요",
                  ),
                  "branch": pr.get("head", {}).get(
                      "ref",
                      "브랜치 확인 필요",
                  ),
                  "pr_number": pr["number"],
                  "pr_url": pr["html_url"],
                  "status": "병합 완료",
              }

          payload = {
              "parent": {
                  "type": "data_source_id",
                  "data_source_id": data_source_id,
              },
              "properties": {
                  "개발 내용": {
                      "title": [
                          {
                              "type": "text",
                              "text": {
                                  "content": log["title"],
                              },
                          }
                      ]
                  },
                  "날짜": {
                      "date": {
                          "start": log["date"],
                      }
                  },
                  "저장소": {
                      "select": {
                          "name": log["repository"],
                      }
                  },
                  "작업자": {
                      "rich_text": [
                          {
                              "type": "text",
                              "text": {
                                  "content": log["author"],
                              },
                          }
                      ]
                  },
                  "브랜치": {
                      "rich_text": [
                          {
                              "type": "text",
                              "text": {
                                  "content": log["branch"],
                              },
                          }
                      ]
                  },
                  "PR 번호": {
                      "number": log["pr_number"],
                  },
                  "PR 링크": {
                      "url": log["pr_url"],
                  },
                  "상태": {
                      "select": {
                          "name": log["status"],
                      }
                  },
                  "팀장 검토": {
                      "checkbox": False,
                  },
              },
          }

          request = urllib.request.Request(
              "https://api.notion.com/v1/pages",
              data=json.dumps(payload).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Notion-Version": "2026-03-11",
                  "Content-Type": "application/json",
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.loads(response.read().decode("utf-8"))

              print("Notion 개발일지 작성 성공")
              print(result.get("url", "페이지 URL 없음"))

          except urllib.error.HTTPError as error:
              error_body = error.read().decode("utf-8")
              raise RuntimeError(
                  f"Notion API 오류 {error.code}: {error_body}"
              ) from error
          PY

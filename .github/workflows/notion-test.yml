name: Notion 연결 테스트

on:
  workflow_dispatch:

jobs:
  create-notion-test-page:
    runs-on: ubuntu-latest

    steps:
      - name: Notion 개발일지에 테스트 기록 생성
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
        run: |
          curl --fail-with-body \
            --request POST \
            --url "https://api.notion.com/v1/pages" \
            --header "Authorization: Bearer $NOTION_TOKEN" \
            --header "Notion-Version: 2026-03-11" \
            --header "Content-Type: application/json" \
            --data "{
              \"parent\": {
                \"type\": \"data_source_id\",
                \"data_source_id\": \"$NOTION_DATA_SOURCE_ID\"
              },
              \"properties\": {
                \"개발 내용\": {
                  \"title\": [
                    {
                      \"type\": \"text\",
                      \"text\": {
                        \"content\": \"[Web] GitHub Actions 연결 테스트\"
                      }
                    }
                  ]
                }
              }
            }"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: soldesk-web:local
    container_name: soldesk-web
    env_file:
      - .env
    environment:
      PROFILE_IMAGE_UPLOAD_DIR: /app/uploads/profile-images
      RESTAURANT_IMAGE_UPLOAD_DIR: /app/uploads/restaurant-images
      RECEIPT_IMAGE_UPLOAD_DIR: /app/uploads/receipt-images
      REVIEW_IMAGE_UPLOAD_DIR: /app/uploads/review-images
      CHAT_LOG_FILE_PATH: /app/logs/support-chat.jsonl
      BUSINESS_VERIFY_BASE_URL: http://ocr-api:8000
      BUSINESS_VERIFY_INTERNAL_TOKEN: ${BUSINESS_VERIFY_INTERNAL_TOKEN:-}
      RECOMMENDATION_INTERNAL_TOKEN: ${RECOMMENDATION_INTERNAL_TOKEN:-}
    ports:
      - "8081:8081"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--output", "/dev/null", "http://127.0.0.1:8081/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  ocr-api:
    build:
      context: ../../SoldeskProject2_Python/receipt-biz-verify
      dockerfile: Dockerfile
    image: soldesk-ocr:local
    container_name: soldesk-ocr
    env_file:
      - path: ../../SoldeskProject2_Python/receipt-biz-verify/.env
        required: false
    environment:
      INTERNAL_API_TOKEN: ${BUSINESS_VERIFY_INTERNAL_TOKEN:-}
    init: true
    ipc: host
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

# recommendation-api(AI 추천, GPU 필요)는 의도적으로 Docker화하지 않는다 — 팀원 로컬 PC 한 대에서만
# 돌아가는 프로세스라 컨테이너화 이득이 크지 않고, Cloudflare Tunnel(ai.eattyway.com)로 그대로 노출한다.
# web 서비스는 .env의 RECOMMENDATION_BASE_URL(Jenkins 크리덴셜, ai.eattyway.com)을 그대로 쓴다.

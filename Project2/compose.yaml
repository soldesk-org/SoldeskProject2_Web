services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: soldesk-web:local
    container_name: soldesk-web
    env_file:
      - .env
    environment:
      PROFILE_IMAGE_UPLOAD_DIR: /app/uploads/profile-images
      RESTAURANT_IMAGE_UPLOAD_DIR: /app/uploads/restaurant-images
      RECEIPT_IMAGE_UPLOAD_DIR: /app/uploads/receipt-images
      REVIEW_IMAGE_UPLOAD_DIR: /app/uploads/review-images
      CHAT_LOG_FILE_PATH: /app/logs/support-chat.jsonl
      BUSINESS_VERIFY_BASE_URL: http://ocr-api:8000
      BUSINESS_VERIFY_INTERNAL_TOKEN: ${BUSINESS_VERIFY_INTERNAL_TOKEN:-}
      RECOMMENDATION_BASE_URL: http://recommendation-api:8000
      RECOMMENDATION_INTERNAL_TOKEN: ${RECOMMENDATION_INTERNAL_TOKEN:-}
    ports:
      - "8081:8081"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--output", "/dev/null", "http://127.0.0.1:8081/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  ocr-api:
    build:
      context: ../../SoldeskProject2_Python/receipt-biz-verify
      dockerfile: Dockerfile
    image: soldesk-ocr:local
    container_name: soldesk-ocr
    env_file:
      - path: ../../SoldeskProject2_Python/receipt-biz-verify/.env
        required: false
    environment:
      INTERNAL_API_TOKEN: ${BUSINESS_VERIFY_INTERNAL_TOKEN:-}
    init: true
    ipc: host
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  recommendation-api:
    build:
      context: ../../SoldeskProject2_Python/keyword-extraction
      dockerfile: Dockerfile
    image: soldesk-recommendation:local
    container_name: soldesk-recommendation
    env_file:
      - path: ../../SoldeskProject2_Python/keyword-extraction/.env
        required: false
    environment:
      KAKAO_REST_API_KEY: ${KAKAO_CLIENT_ID:-}
      REVIEW_STATS_URL: http://web:8081/internal/reviews/keyword-ratios
      INTERNAL_API_TOKEN: ${RECOMMENDATION_INTERNAL_TOKEN:-}
    init: true
    gpus: all
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - recommendation-models:/models/huggingface
    restart: unless-stopped

volumes:
  recommendation-models:
    name: soldesk-recommendation-models
    external: true

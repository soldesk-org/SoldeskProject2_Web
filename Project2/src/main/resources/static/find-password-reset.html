<!DOCTYPE html>
<html lang="ko" data-auth-state="guest">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>새 비밀번호 설정 — 잇티웨이</title>
<meta name="description" content="새로운 비밀번호를 설정해주세요.">

<!--
================================================================================
 find-password-reset — 비밀번호 찾기 STEP 3 : 새 비밀번호 입력
--------------------------------------------------------------------------------
 ※ 이 화면은 메일 링크(?token=...)로 진입합니다.
    #resetToken 에 URL 쿼리의 token 값을 채워 서버로 함께 전송하세요.

 [폼]
   #resetPasswordForm        폼 루트
   #resetToken               재설정 토큰 hidden (name="token")
   #resetTargetEmail         대상 이메일 표시 (읽기 전용) ★ 서버 값
   #newPassword              새 비밀번호 (name="newPassword")
   #newPasswordConfirm       새 비밀번호 확인 (name="newPasswordConfirm")
   #newPwToggleBtn / #newPwConfirmToggleBtn   표시 토글
   #newPwStrengthBar / #newPwStrengthText     강도 게이지
   #ruleLength #ruleMix #ruleSpecial #ruleNotSame   조건 체크리스트 (.is-ok 부여)
   #newPasswordError / #newPasswordConfirmError
   #resetSubmitBtn           변경하기 → find-password-done
                             ★ POST /api/auth/password/reset
   #tokenExpiredAlert        토큰 만료 배너 (hidden 해제)
================================================================================
-->

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/css/eatty.css">
<script defer src="assets/js/api.js"></script>
<script defer src="assets/js/eatty-ui.js"></script>
<script defer src="assets/js/find-password-reset.js"></script>
<style>
  /* 비밀번호 조건 체크리스트 */
  .pw-rule { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-400); font-weight: 600; }
  .pw-rule .dot {
    width: 16px; height: 16px; border-radius: 50%; flex: none;
    background: var(--ink-100); display: grid; place-items: center;
    transition: background .2s var(--ease);
  }
  .pw-rule .dot svg { width: 10px; height: 10px; color: #fff; opacity: 0; transition: opacity .2s; }
  .pw-rule.is-ok { color: var(--success-ink); }
  .pw-rule.is-ok .dot { background: var(--success); }
  .pw-rule.is-ok .dot svg { opacity: 1; }
</style>
</head>

<body class="min-h-screen flex flex-col bg-[var(--bg-soft)]">

<header class="e-header e-header--solid">
  <div class="e-container e-header-inner">
    <a href="index" class="e-logo">
      <span class="e-logo-mark" aria-hidden="true"><img src="img/logo.png" alt="잇티웨이" class="e-logo-img"></span>
      <span class="e-logo-text">잇티<em>웨이</em></span>
    </a>
    <div class="e-header-actions">
      <a href="login" class="btn btn-outline btn-sm">로그인</a>
    </div>
  </div>
</header>

<main class="flex-1 grid place-items-center py-12 px-5">
  <div class="w-full" style="max-width:520px">

    <div class="text-center mb-8">
      <span class="w-14 h-14 rounded-[16px] grid place-items-center mx-auto mb-5" style="background:var(--brand-50);color:var(--brand-500)">
        <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="m9 15 2 2 4-4"/>
        </svg>
      </span>
      <h1 class="t-h3">새 비밀번호 설정</h1>
      <p class="t-sm mt-2.5">안전한 비밀번호로 변경해주세요.</p>
    </div>

    <div class="e-card e-card-flat p-4 mb-5">
      <div class="e-steps">
        <div class="e-step is-done">
          <span class="e-step-dot">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </span>
          <span class="e-step-label">이메일 입력</span>
        </div>
        <span class="e-step-line" style="background:var(--brand-300)"></span>
        <div class="e-step is-done">
          <span class="e-step-dot">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </span>
          <span class="e-step-label">메일 확인</span>
        </div>
        <span class="e-step-line" style="background:var(--brand-300)"></span>
        <div class="e-step is-current">
          <span class="e-step-dot">3</span>
          <span class="e-step-label">재설정</span>
        </div>
        <span class="e-step-line"></span>
        <div class="e-step">
          <span class="e-step-dot">4</span>
          <span class="e-step-label">완료</span>
        </div>
      </div>
    </div>

    <div class="e-card e-card-pad">

      <!-- 토큰 만료 안내 (기본 숨김) -->
      <div class="e-alert e-alert--danger mb-6" id="tokenExpiredAlert" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
        <div>
          <p class="e-alert-title">재설정 링크가 만료되었습니다</p>
          <p><a href="find-password" class="underline font-bold">비밀번호 찾기</a>를 다시 진행해주세요.</p>
        </div>
      </div>

      <form id="resetPasswordForm" novalidate>
        <input type="hidden" id="resetToken" name="token" value="">

        <div class="e-field">
          <label class="e-label" for="resetTargetEmail">계정</label>
          <div class="e-input-wrap has-icon">
            <svg class="e-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/>
            </svg>
            <input type="email" class="e-input" id="resetTargetEmail" value="eatty@example.com" readonly>
          </div>
        </div>

        <div class="e-field">
          <label class="e-label" for="newPassword">새 비밀번호 <span class="req">*</span></label>
          <div class="e-input-wrap has-icon has-suffix">
            <svg class="e-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
            </svg>
            <input type="password" class="e-input" id="newPassword" name="newPassword"
                   placeholder="새 비밀번호 입력" autocomplete="new-password" required>
            <span class="e-input-suffix">
              <button type="button" class="e-eye" id="newPwToggleBtn" data-password-toggle="newPassword" aria-label="비밀번호 표시">
                <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.6 6.2A9.6 9.6 0 0 1 12 6c6.4 0 10 6 10 6a17 17 0 0 1-2.4 3M6.3 7.8A16.6 16.6 0 0 0 2 12s3.6 6 10 6c1.6 0 3-.3 4.2-.9"/><path d="M3 3l18 18"/></svg>
              </button>
            </span>
          </div>

          <div class="flex items-center gap-3 mt-2.5">
            <div class="e-progress e-progress-sm flex-1">
              <div class="e-progress-bar" id="newPwStrengthBar" style="width:0%"></div>
            </div>
            <span class="text-[12px] font-bold text-[var(--ink-400)] w-16 text-right" id="newPwStrengthText">-</span>
          </div>

          <!-- 조건 체크리스트 -->
          <div class="grid grid-cols-2 gap-2 mt-3.5">
            <div class="pw-rule" id="ruleLength">
              <span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
              8자 이상
            </div>
            <div class="pw-rule" id="ruleMix">
              <span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
              영문 + 숫자
            </div>
            <div class="pw-rule" id="ruleSpecial">
              <span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
              특수문자 포함
            </div>
            <div class="pw-rule" id="ruleNotSame">
              <span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
              연속 문자 3회 미만
            </div>
          </div>

          <p class="e-error" id="newPasswordError">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
            비밀번호 조건을 만족하지 않습니다.
          </p>
        </div>

        <div class="e-field">
          <label class="e-label" for="newPasswordConfirm">새 비밀번호 확인 <span class="req">*</span></label>
          <div class="e-input-wrap has-icon has-suffix">
            <svg class="e-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
            </svg>
            <input type="password" class="e-input" id="newPasswordConfirm" name="newPasswordConfirm"
                   placeholder="새 비밀번호 재입력" autocomplete="new-password" required>
            <span class="e-input-suffix">
              <button type="button" class="e-eye" id="newPwConfirmToggleBtn" data-password-toggle="newPasswordConfirm" aria-label="비밀번호 표시">
                <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.6 6.2A9.6 9.6 0 0 1 12 6c6.4 0 10 6 10 6a17 17 0 0 1-2.4 3M6.3 7.8A16.6 16.6 0 0 0 2 12s3.6 6 10 6c1.6 0 3-.3 4.2-.9"/><path d="M3 3l18 18"/></svg>
              </button>
            </span>
          </div>
          <p class="e-error" id="newPasswordConfirmError">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
            비밀번호가 일치하지 않습니다.
          </p>
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-block" id="resetSubmitBtn">비밀번호 변경하기</button>
      </form>
    </div>

    <div class="e-alert e-alert--warning mt-5">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 2.5 18a1.8 1.8 0 0 0 1.6 2.7h15.8A1.8 1.8 0 0 0 21.5 18L13.7 3.9a1.9 1.9 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>
      <div>
        <p class="e-alert-title">변경 시 모든 기기에서 로그아웃됩니다</p>
        <p>보안을 위해 기존 로그인 세션이 모두 종료됩니다.</p>
      </div>
    </div>
  </div>
</main>

<footer class="py-8 border-t border-[var(--line)] bg-white">
  <div class="e-container flex flex-wrap items-center justify-between gap-3">
    <p class="t-xs">&copy; 2026 Eatty way.</p>
    <nav class="flex gap-4 t-xs">
      <a href="terms-service" class="e-link">이용약관</a>
      <a href="terms-privacy" class="e-link">개인정보처리방침</a>
    </nav>
  </div>
</footer>

</body>
</html>

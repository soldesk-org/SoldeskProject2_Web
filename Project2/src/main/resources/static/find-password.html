<!DOCTYPE html>
<html lang="ko" data-auth-state="guest">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>잇티웨이</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/images/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
<meta name="description" content="가입한 이메일로 비밀번호 재설정 링크를 보내드립니다.">

<!--
================================================================================
 find-password — 비밀번호 찾기 STEP 1 : 이메일 입력
--------------------------------------------------------------------------------
 [스테퍼]  #findPwSteps  (1 이메일 / 2 메일 확인 / 3 재설정 / 4 완료)

 [폼]
   #findPasswordForm      폼 루트
   #findPwEmail           가입 이메일 (name="email")
   ※ 형식 오류 등은 Eatty.toast()로 표시합니다(2026-08-04 인라인 에러 제거).
   ※ 이 API는 계정 존재 여부를 노출하지 않도록 항상 200으로 응답합니다(가입 여부와 무관).
   #findPwSubmitBtn       재설정 메일 발송 → find-password-sent
                          ★ POST /api/auth/password/reset-request

 [계정 유형]
   input[name="memberType"]  #pwTypeNormal / #pwTypeBusiness

 [링크]
   #toLoginLink        → login
   #toFindEmailLink    → find-email
================================================================================
-->

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/css/eatty.css">
<script defer src="assets/js/api.js"></script>
<script defer src="assets/js/eatty-ui.js"></script>
<script defer src="assets/js/find-password.js"></script>
</head>

<body class="min-h-screen flex flex-col bg-[var(--bg-soft)]">

<header class="e-header e-header--solid">
  <div class="e-container e-header-inner">
    <a href="index" class="e-logo">
      <span class="e-logo-mark" aria-hidden="true"><img src="img/logo.png" alt="잇티웨이" class="e-logo-img"></span>
      <span class="e-logo-text">잇티<em>웨이</em></span>
    </a>
    <div class="e-header-actions">
      <a href="login" class="btn btn-outline btn-sm" id="toLoginLink">로그인</a>
    </div>
  </div>
</header>

<main class="flex-1 grid place-items-center py-12 px-5">
  <div class="w-full" style="max-width:520px;min-width:0">

    <div class="e-card e-card-flat p-4 mb-5">
      <div class="e-steps" id="findPwSteps">
        <div class="e-step is-current">
          <span class="e-step-dot">1</span>
          <span class="e-step-label">이메일 입력</span>
        </div>
        <span class="e-step-line"></span>
        <div class="e-step">
          <span class="e-step-dot">2</span>
          <span class="e-step-label">메일 확인</span>
        </div>
        <span class="e-step-line"></span>
        <div class="e-step">
          <span class="e-step-dot">3</span>
          <span class="e-step-label">재설정</span>
        </div>
        <span class="e-step-line"></span>
        <div class="e-step">
          <span class="e-step-dot">4</span>
          <span class="e-step-label">완료</span>
        </div>
      </div>
    </div>

    <div class="e-card e-card-pad">

      <form id="findPasswordForm" novalidate>

        <div class="e-field">
          <span class="e-label">계정 유형</span>
          <div class="grid grid-cols-2 gap-2.5">
            <label class="e-choice" for="pwTypeNormal">
              <input type="radio" id="pwTypeNormal" name="memberType" value="normal" checked>
              <span class="e-choice-body !p-3.5 text-center">
                <span class="block text-[14.5px] font-extrabold text-[var(--ink-900)]">일반 회원</span>
              </span>
            </label>
            <label class="e-choice" for="pwTypeBusiness">
              <input type="radio" id="pwTypeBusiness" name="memberType" value="business">
              <span class="e-choice-body !p-3.5 text-center">
                <span class="block text-[14.5px] font-extrabold text-[var(--ink-900)]">사업자 회원</span>
              </span>
            </label>
          </div>
        </div>

        <div class="e-field">
          <label class="e-label" for="findPwEmail">가입 이메일 <span class="req">*</span></label>
          <div class="e-input-wrap has-icon">
            <svg class="e-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/>
            </svg>
            <input type="email" class="e-input" id="findPwEmail" name="email" placeholder="eatty@example.com" autocomplete="email" required>
          </div>
          <p class="e-hint">가입 시 사용한 이메일 주소를 정확히 입력해주세요.</p>
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-block" id="findPwSubmitBtn">재설정 메일 받기</button>
      </form>

      <div class="e-divider">또는</div>

      <div class="flex flex-col gap-2.5">
        <a href="find-email" class="btn btn-outline btn-block" id="toFindEmailLink">이메일 찾기</a>
        <a href="signup" class="btn btn-ghost btn-block">회원가입</a>
      </div>
    </div>
  </div>
</main>

<footer class="py-8 border-t border-[var(--line)] bg-white">
  <div class="e-container flex flex-wrap items-center justify-between gap-3">
    <p class="t-xs">&copy; 2026 Eatty way.</p>
    <nav class="flex gap-4 t-xs">
      <a href="terms-service" class="e-link">이용약관</a>
      <a href="terms-privacy" class="e-link">개인정보처리방침</a>
    </nav>
  </div>
</footer>

</body>
</html>

<!DOCTYPE html>
<html lang="ko" data-auth-state="guest">
<head>
	<!-- Google AdSense -->
	<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2263743447124092" crossorigin="anonymous"></script>
<meta charset="UTF-8">
<!-- 페이지 전환 흰 번쩍임 방지(2026-08-21) — index.html의 같은 위치 주석 참고 -->
<style>html{background-color:#f8f7fb}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>잇티웨이</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/images/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
<meta name="description" content="잇티웨이 사업자 회원 로그인. 내 매장 정보와 리뷰 반응을 관리하세요.">

<!--
================================================================================
 login-business — 사업자 회원 로그인
--------------------------------------------------------------------------------
 [폼]
   #bizLoginForm              사업자 로그인 폼 (POST /api/auth/login/business)
   #bizLoginEmail             사업자 이메일 (name="email")
   #bizLoginPassword          비밀번호     (name="password")
   #bizTogglePasswordBtn      비밀번호 표시/숨김 (data-password-toggle="bizLoginPassword")
   #bizRememberMe             로그인 상태 유지 (name="rememberMe")
   #bizLoginSubmitBtn         로그인 실행
   #bizLoginEmailError        이메일 에러
   #bizLoginPasswordError     비밀번호 에러
   ※ 서버 응답 에러(로그인 실패 등)는 배너가 아니라 Eatty.toast()로 표시합니다.

 [링크]
   #bizSignupLink         → signup-business
   #bizFindPasswordLink   → find-password
   #bizFindEmailLink      → find-email
   #normalLoginLink       → login (일반 회원 로그인)
================================================================================
-->

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<!-- ?v= 는 캐시 무효화용(2026-08-21) — recommend.html의 같은 위치 주석 참고 -->
<link rel="stylesheet" href="assets/css/eatty.css?v=20260826d">
<script defer src="assets/js/api.js?v=20260822a"></script>
<script defer src="assets/js/eatty-ui.js"></script>
<script defer src="assets/js/login-business.js"></script>
</head>

<body>
<div class="e-auth">

  <!-- ========================= 좌측 브랜드 비주얼 ========================= -->
  <aside class="e-auth-aside" style="background:linear-gradient(150deg,#26222c 0%,#3a3543 48%,#c33f21 100%)">
    <a href="/" class="e-logo relative z-10">
      <span class="e-logo-mark" aria-hidden="true"><img src="img/logo.png" alt="잇티웨이" class="e-logo-img"></span>
      <span class="e-logo-text !text-white">잇티<em class="!text-white !bg-none">웨이</em></span>
      <span class="e-badge e-badge--brand-solid ml-1">BUSINESS</span>
    </a>

    <div class="relative z-10 mt-auto">
      <p class="text-white/75 text-sm font-bold tracking-wide">FOR BUSINESS OWNERS</p>
      <h2 class="text-white font-extrabold text-[34px] leading-[1.25] tracking-[-.035em] mt-4">
        우리 가게를<br>직접 관리하세요
      </h2>
      <p class="text-white/80 mt-5 text-[15px] leading-relaxed max-w-sm">
        영수증 인증 리뷰의 긍정·부정 태그 분포를 확인하고, 매장 정보를 최신 상태로 유지할 수 있습니다.
      </p>
    </div>
  </aside>

  <!-- ============================== 우측 폼 ============================== -->
  <main class="e-auth-main">

    <div class="flex items-center justify-between lg:hidden mb-10">
      <a href="/" class="e-logo">
        <span class="e-logo-mark" aria-hidden="true"><img src="img/logo.png" alt="잇티웨이" class="e-logo-img"></span>
        <span class="e-logo-text">잇티<em>웨이</em></span>
      </a>
      <a href="/" class="btn btn-ghost btn-sm">홈으로</a>
    </div>

    <div class="e-auth-card">

      <div class="e-segment w-full mb-8" role="tablist" aria-label="회원 유형 선택">
        <a href="login" class="e-segment-item flex-1 text-center" role="tab" aria-selected="false" id="normalLoginLink">일반 회원</a>
        <a href="login-business" class="e-segment-item flex-1 text-center" role="tab" aria-selected="true">사업자 회원</a>
      </div>

      <span class="e-badge e-badge--dark mb-3">사업자 전용</span>
      <h1 class="e-auth-title">사업자 로그인</h1>
      <p class="e-auth-sub">매장 관리자 계정으로 로그인합니다.</p>

      <form class="mt-7" id="bizLoginForm" novalidate>

        <div class="e-field">
          <label class="e-label" for="bizLoginEmail">사업자 이메일 <span class="req">*</span></label>
          <div class="e-input-wrap has-icon">
            <svg class="e-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/>
            </svg>
            <input type="email" class="e-input" id="bizLoginEmail" name="email"
                   placeholder="owner@myshop.com" autocomplete="email" required>
          </div>
          <p class="e-error" id="bizLoginEmailError">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
            올바른 이메일 형식을 입력해주세요.
          </p>
        </div>

        <div class="e-field">
          <label class="e-label" for="bizLoginPassword">
            비밀번호 <span class="req">*</span>
            <a href="find-password" class="e-label-side hover:text-[var(--brand-600)]" id="bizFindPasswordLink">비밀번호를 잊으셨나요?</a>
          </label>
          <div class="e-input-wrap has-icon has-suffix">
            <svg class="e-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
            </svg>
            <input type="password" class="e-input" id="bizLoginPassword" name="password"
                   placeholder="비밀번호 입력" autocomplete="current-password" required>
            <span class="e-input-suffix">
              <button type="button" class="e-eye" id="bizTogglePasswordBtn" data-password-toggle="bizLoginPassword" aria-label="비밀번호 표시">
                <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.6 6.2A9.6 9.6 0 0 1 12 6c6.4 0 10 6 10 6a17 17 0 0 1-2.4 3M6.3 7.8A16.6 16.6 0 0 0 2 12s3.6 6 10 6c1.6 0 3-.3 4.2-.9"/><path d="M3 3l18 18"/></svg>
              </button>
            </span>
          </div>
          <p class="e-error" id="bizLoginPasswordError">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
            비밀번호를 입력해주세요.
          </p>
        </div>

        <div class="flex items-center justify-between mb-6">
          <label class="e-check" for="bizRememberMe">
            <input type="checkbox" id="bizRememberMe" name="rememberMe" value="true">
            <span>로그인 상태 유지</span>
          </label>
          <a href="find-email" class="e-link text-[13px]" id="bizFindEmailLink">이메일 찾기</a>
        </div>

        <button type="submit" class="btn btn-secondary btn-lg btn-block" id="bizLoginSubmitBtn">사업자 로그인</button>
      </form>

      <p class="text-center text-sm text-[var(--ink-500)] mt-8">
        사업자 계정이 없으신가요?
        <a href="signup-business" class="e-link-brand ml-1" id="bizSignupLink">사업자 회원가입</a>
      </p>
    </div>
  </main>
</div>
</body>
</html>

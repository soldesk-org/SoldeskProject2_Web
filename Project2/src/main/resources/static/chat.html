<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>잇티챗 | 잇티웨이</title>
<link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
<div class="flex h-screen w-full overflow-hidden bg-white font-['Inter','Noto_Sans_KR',sans-serif]">
  <aside class="relative z-10 flex w-[280px] shrink-0 flex-col bg-white">
    <a href="explore" class="flex justify-center">
      <img src="assets/images/logo-full.png" alt="잇티웨이 로고" class="size-[220px] object-contain" />
    </a>
    <nav class="mt-2 flex flex-col gap-4 overflow-y-auto px-6 pb-6">
      <a href="explore" data-nav="explore" class="flex items-center gap-4 rounded-[10px] px-3 py-3 transition-colors">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <span class="whitespace-nowrap text-[22px] font-semibold tracking-[-1.1px]">탐색</span>
      </a>
      <a href="recommend" data-nav="recommend" class="flex items-center gap-4 rounded-[10px] px-3 py-3 transition-colors">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg>
        <span class="whitespace-nowrap text-[22px] font-semibold tracking-[-1.1px]">추천</span>
      </a>
      <a href="mypage?tab=favorites" data-nav="mypage?tab=favorites" class="flex items-center gap-4 rounded-[10px] px-3 py-3 transition-colors">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        <span class="whitespace-nowrap text-[22px] font-semibold tracking-[-1.1px]">즐겨찾기</span>
      </a>
      <a href="taste-quiz" data-nav="taste-quiz" class="flex items-center gap-4 rounded-[10px] px-3 py-3 transition-colors">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
        <span class="whitespace-nowrap text-[22px] font-semibold tracking-[-1.1px]">입맛 유형 찾기</span>
      </a>
      <a href="mypage" data-nav="mypage" class="flex items-center gap-4 rounded-[10px] px-3 py-3 transition-colors">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="whitespace-nowrap text-[22px] font-semibold tracking-[-1.1px]">마이페이지</span>
      </a>
      <a href="chat" data-nav="chat" class="flex items-center gap-4 rounded-[10px] px-3 py-3 transition-colors">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
        <span class="whitespace-nowrap text-[22px] font-semibold tracking-[-1.1px]">잇티챗</span>
      </a>
      <a href="business-mypage" data-nav="business-mypage" data-role="BUSINESS" class="flex items-center gap-4 rounded-[10px] px-3 py-3 transition-colors">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/><path d="M22 7v3a2 2 0 0 1-2 2a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12a2 2 0 0 1-2-2V7"/></svg>
        <span class="whitespace-nowrap text-[22px] font-semibold tracking-[-1.1px]">사업자</span>
      </a>
      <a href="admin" data-nav="admin" data-role="ADMIN" class="flex items-center gap-4 rounded-[10px] px-3 py-3 transition-colors">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><path d="M12 2a5 5 0 0 0-5 5v2a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2V7a5 5 0 0 0-5-5Z"/><path d="M9 7a3 3 0 0 1 6 0v2H9Z"/></svg>
        <span class="whitespace-nowrap text-[22px] font-semibold tracking-[-1.1px]">관리자 전용</span>
      </a>
      <button type="button" data-logout-btn class="flex items-center gap-4 rounded-[10px] px-3 py-3 text-left transition-colors text-[rgba(37,55,75,0.6)] hover:bg-[rgba(254,162,85,0.1)]">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span class="whitespace-nowrap text-[22px] font-semibold tracking-[-1.1px]">로그아웃</span>
      </button>
    </nav>
  </aside>

  <!-- Entry -->
  <div id="chat-entry" class="flex flex-1 flex-col items-center justify-center p-6">
    <div class="w-full max-w-[480px]">
      <h1 class="bg-gradient-to-r from-[#fea255] to-[#fd6d4a] bg-clip-text text-center text-[40px] font-bold tracking-[-2px] text-transparent">잇티챗</h1>
      <p class="mt-2 text-center text-[18px] font-medium text-[rgba(37,55,75,0.6)]">같이 먹을 사람을 구하고, 실시간으로 이야기해보세요.</p>

      <button id="create-room-btn" class="mt-10 flex h-[56px] w-full items-center justify-center gap-2 rounded-[12px] bg-gradient-to-r from-[#fea255] to-[#fd6d4a] text-[19px] font-semibold text-white transition-opacity hover:opacity-90">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        새 채팅방 만들기
      </button>

      <div class="my-6 flex items-center gap-3">
        <span class="h-px flex-1 bg-[rgba(37,55,75,0.15)]"></span>
        <span class="text-[14px] font-medium text-[rgba(37,55,75,0.5)]">또는</span>
        <span class="h-px flex-1 bg-[rgba(37,55,75,0.15)]"></span>
      </div>

      <label class="text-[15px] font-semibold text-[rgba(37,55,75,0.6)]">채팅방 코드로 입장하기</label>
      <div class="mt-2 flex gap-2">
        <div class="relative flex-1">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-[rgba(37,55,75,0.4)]"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></svg>
          <input id="join-code-input" placeholder="예: AB12CD" class="h-[52px] w-full rounded-[10px] border border-[rgba(37,55,75,0.15)] bg-white pl-11 pr-4 text-[17px] tracking-[1px] text-[#25374b] placeholder:tracking-normal placeholder:text-[rgba(37,55,75,0.35)] outline-none focus:border-[#fd6d4a]" />
        </div>
        <button id="join-btn" disabled style="opacity:0.4" class="h-[52px] shrink-0 rounded-[10px] bg-white px-6 text-[17px] font-semibold text-[#fd6d4a] outline outline-1 outline-[#fd6d4a] transition-opacity hover:opacity-80">입장</button>
      </div>
      <p id="chat-entry-error" class="mt-3 text-[15px] font-medium text-red-500" style="display:none"></p>

      <div class="mt-8">
        <label class="text-[15px] font-semibold text-[rgba(37,55,75,0.6)]">내 채팅방</label>
        <div id="my-rooms-list" class="mt-2 flex flex-col gap-2">
          <p class="text-[14px] text-[rgba(37,55,75,0.4)]">불러오는 중...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Room -->
  <div id="chat-room" style="display:none" class="flex min-w-0 flex-1">
    <div class="flex min-w-0 flex-1 flex-col">
      <div class="flex items-center justify-between border-b border-[rgba(37,55,75,0.1)] px-8 py-5">
        <div class="flex items-center gap-4">
          <button id="chat-leave-btn" aria-label="나가기" class="flex size-[36px] shrink-0 items-center justify-center rounded-[10px] text-[rgba(37,55,75,0.5)] hover:bg-[rgba(37,55,75,0.05)]">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
          </button>
          <div>
            <h1 id="room-title" class="text-[28px] font-semibold tracking-[-1.4px] text-[#25374b]"></h1>
            <p id="room-meta" class="mt-1 text-[16px] font-medium text-[rgba(37,55,75,0.5)]"></p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button id="chat-report-room-btn" class="rounded-[10px] px-3 py-2 text-[15px] font-medium text-[rgba(37,55,75,0.5)] hover:bg-[rgba(37,55,75,0.05)]">방 신고</button>
          <button id="chat-explode-btn" style="display:none" class="rounded-[10px] bg-red-50 px-3 py-2 text-[15px] font-medium text-red-500 hover:bg-red-100">방 폭파</button>
        </div>
      </div>

      <div id="chat-messages" class="flex min-h-0 flex-1 flex-col gap-5 overflow-y-auto px-8 py-6"></div>

      <div class="flex items-center gap-3 border-t border-[rgba(37,55,75,0.1)] px-8 py-5">
        <input id="chat-draft" placeholder="메시지를 입력하세요" class="h-[52px] min-w-0 flex-1 rounded-[10px] border border-[rgba(37,55,75,0.15)] bg-white px-5 text-[18px] text-[#25374b] placeholder:text-[rgba(37,55,75,0.4)] outline-none focus:border-[#fd6d4a]" />
        <button id="chat-send-btn" class="flex h-[52px] shrink-0 items-center gap-2 rounded-[10px] bg-gradient-to-r from-[#fea255] to-[#fd6d4a] px-6 text-[18px] font-semibold text-white transition-opacity hover:opacity-90">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>
          전송
        </button>
      </div>
    </div>

    <aside class="hidden w-[320px] shrink-0 flex-col border-l border-[rgba(37,55,75,0.1)] bg-white lg:flex">
      <button id="participants-toggle" class="flex items-center justify-between px-6 py-5 text-left">
        <span class="text-[18px] font-semibold tracking-[-0.9px] text-[#25374b]">참여자 4명</span>
        <svg id="participants-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[rgba(37,55,75,0.5)]"><path d="m18 15-6-6-6 6"/></svg>
      </button>
      <div id="participants-list" class="flex flex-col gap-3 overflow-y-auto px-6 pb-6"></div>
    </aside>
  </div>

  <!-- Create room modal -->
  <div id="create-room-modal" style="display:none" class="fixed inset-0 z-50 items-center justify-center bg-[rgba(37,55,75,0.4)] p-4">
    <div class="relative w-full max-w-[440px] rounded-[20px] bg-white p-8 shadow-2xl">
      <button id="modal-x" aria-label="닫기" class="absolute right-5 top-5 text-[rgba(37,55,75,0.4)] hover:text-[#25374b]">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>

      <h2 class="text-[24px] font-bold tracking-[-1.2px] text-[#25374b]">채팅방 만들기</h2>
      <p class="mt-1 text-[15px] font-medium text-[rgba(37,55,75,0.6)]">방 이름을 정하고, 코드를 친구에게 공유하세요.</p>

      <label class="mt-6 block text-[15px] font-semibold text-[rgba(37,55,75,0.6)]">채팅방 이름</label>
      <input id="modal-name-input" placeholder="예: 오늘 홍대에서 뭐 먹을까요?" class="mt-2 h-[52px] w-full rounded-[10px] border border-[rgba(37,55,75,0.15)] bg-white px-4 text-[17px] text-[#25374b] placeholder:text-[rgba(37,55,75,0.35)] outline-none focus:border-[#fd6d4a]" />

      <div id="modal-code-group" style="display:none">
        <label class="mt-5 block text-[15px] font-semibold text-[rgba(37,55,75,0.6)]">생성된 채팅방 코드</label>
        <div class="mt-2 flex items-center justify-between rounded-[10px] bg-[rgba(254,162,85,0.15)] px-4 py-3">
          <span id="modal-code" class="text-[22px] font-bold tracking-[3px] text-[#fd6d4a]"></span>
          <button id="modal-copy" class="flex items-center gap-1 rounded-[8px] px-3 py-1.5 text-[14px] font-semibold text-[#fd6d4a] hover:bg-white/60">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
            <span class="copy-label">복사</span>
          </button>
        </div>
      </div>
      <p id="modal-error" class="mt-3 text-[15px] font-medium text-red-500" style="display:none"></p>

      <div class="mt-7 flex gap-3">
        <button id="modal-cancel" class="h-[52px] flex-1 rounded-[10px] border border-[rgba(37,55,75,0.3)] text-[17px] font-semibold text-[#25374b] hover:bg-[rgba(37,55,75,0.05)]">취소</button>
        <button id="modal-create" class="h-[52px] flex-1 rounded-[10px] bg-gradient-to-r from-[#fea255] to-[#fd6d4a] text-[17px] font-semibold text-white transition-opacity hover:opacity-90">채팅방 만들기</button>
      </div>
    </div>
  </div>
</div>
<script src="assets/js/api.js"></script>
<script src="assets/js/sidebar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
<script src="assets/js/chat.js"></script>
</body>
</html>

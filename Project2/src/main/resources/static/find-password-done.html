<!DOCTYPE html>
<html lang="ko" data-auth-state="guest">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>잇티웨이</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/images/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
<meta name="description" content="비밀번호가 성공적으로 변경되었습니다.">

<!--
================================================================================
 find-password-done — 비밀번호 찾기 STEP 4 : 완료
--------------------------------------------------------------------------------
 [출력]  ★ 서버 값으로 채워주세요
   #doneEmail        변경된 계정 이메일
   #doneChangedAt    변경 일시

 [액션]
   #goLoginBtn       로그인하러 가기 → login
   #goHomeBtn        홈으로 → index

 ※ fp_done_at(find-password-reset.js가 비밀번호 변경 성공 직후에만 남기는 값)이 최근(5분 이내)일
   때만 이 화면을 보여준다(2026-08-04 추가) — 이 URL로 바로 들어오거나, 홈으로 이동한 뒤 뒤로가기로
   돌아오는 것도 함께 막는다(find-password-done.js 참고).
================================================================================
-->

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/css/eatty.css">
<script defer src="assets/js/api.js"></script>
<script defer src="assets/js/eatty-ui.js"></script>
<script defer src="assets/js/find-password-done.js"></script>
</head>

<body class="min-h-screen flex flex-col bg-[var(--bg-soft)]">

<header class="e-header e-header--solid">
  <div class="e-container e-header-inner">
    <a href="index" class="e-logo">
      <span class="e-logo-mark" aria-hidden="true"><img src="img/logo.png" alt="잇티웨이" class="e-logo-img"></span>
      <span class="e-logo-text">잇티<em>웨이</em></span>
    </a>
    <div class="e-header-actions">
      <a href="index" class="btn btn-ghost btn-sm" id="goHomeBtn">홈으로</a>
    </div>
  </div>
</header>

<main class="flex-1 grid place-items-center py-12 px-5">
  <div class="w-full" style="max-width:520px">

    <div class="e-card e-card-flat p-4 mb-5">
      <div class="e-steps">
        <div class="e-step is-done">
          <span class="e-step-dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
          <span class="e-step-label">이메일 입력</span>
        </div>
        <span class="e-step-line" style="background:var(--brand-300)"></span>
        <div class="e-step is-done">
          <span class="e-step-dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
          <span class="e-step-label">메일 확인</span>
        </div>
        <span class="e-step-line" style="background:var(--brand-300)"></span>
        <div class="e-step is-done">
          <span class="e-step-dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
          <span class="e-step-label">재설정</span>
        </div>
        <span class="e-step-line" style="background:var(--brand-300)"></span>
        <div class="e-step is-current">
          <span class="e-step-dot">4</span>
          <span class="e-step-label">완료</span>
        </div>
      </div>
    </div>

    <div class="e-card e-card-pad text-center py-12 e-anim-up">
      <span class="w-20 h-20 rounded-full grid place-items-center mx-auto mb-7 text-white" style="background:var(--brand-grad);box-shadow:var(--sh-brand)">
        <svg class="w-10 h-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </span>

      <h1 class="t-h2">비밀번호를 변경했어요</h1>
      <p class="t-lead mt-4">새 비밀번호로 다시 로그인해주세요.</p>

      <div class="mt-8 max-w-sm mx-auto text-left e-card e-card-flat bg-[var(--bg-soft)] p-4 space-y-2.5">
        <div class="flex items-center justify-between gap-3">
          <span class="t-sm font-semibold">계정</span>
          <span class="text-sm font-bold text-[var(--ink-900)] break-all text-right" id="doneEmail">eatty@example.com</span>
        </div>
        <div class="flex items-center justify-between gap-3">
          <span class="t-sm font-semibold">변경 일시</span>
          <span class="text-sm font-bold text-[var(--ink-900)] t-num" id="doneChangedAt">2026-07-31 14:38</span>
        </div>
      </div>

      <div class="mt-8 flex flex-col gap-2.5 max-w-sm mx-auto">
        <a href="login" class="btn btn-primary btn-lg btn-block" id="goLoginBtn">로그인하러 가기</a>
        <a href="index" class="btn btn-ghost btn-block">홈으로 돌아가기</a>
      </div>
    </div>
  </div>
</main>

<footer class="py-8 border-t border-[var(--line)] bg-white">
  <div class="e-container flex flex-wrap items-center justify-between gap-3">
    <p class="t-xs">&copy; 2026 Eatty way.</p>
    <nav class="flex gap-4 t-xs">
      <a href="terms-service" class="e-link">이용약관</a>
      <a href="terms-privacy" class="e-link">개인정보처리방침</a>
    </nav>
  </div>
</footer>

</body>
</html>

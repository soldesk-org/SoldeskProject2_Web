<!DOCTYPE html>
<html lang="ko" data-auth-state="guest">
<head>
	<!-- Google AdSense -->
	<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2263743447124092" crossorigin="anonymous"></script>
<meta charset="UTF-8">
<!-- 페이지 전환 흰 번쩍임 방지(2026-08-21) — index.html의 같은 위치 주석 참고 -->
<style>html{background-color:#f8f7fb}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>잇티웨이</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/images/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
<meta name="description" content="잇티웨이 일반 회원 로그인">

<!--
================================================================================
 login — 일반 회원 로그인
--------------------------------------------------------------------------------
 [폼]
   #loginForm                   로그인 폼 (submit 시 POST /api/auth/login)
   #loginEmail                  이메일 입력      (name="email")
   #loginPassword               비밀번호 입력    (name="password")
   #togglePasswordBtn           비밀번호 표시/숨김 (data-password-toggle="loginPassword")
   #rememberMe                  로그인 상태 유지 체크박스 (name="rememberMe")
   #loginSubmitBtn              로그인 실행 버튼
   #loginEmailError             이메일 유효성 에러 (.is-visible 로 표시)
   #loginPasswordError          비밀번호 유효성 에러
   ※ 서버 응답 에러(로그인 실패 등)는 배너가 아니라 Eatty.toast()로 표시합니다.

 [소셜 로그인]  ★ 각 버튼에 OAuth 이동 로직 연결
   #kakaoLoginBtn   data-social="kakao"
   #naverLoginBtn   data-social="naver"
   #googleLoginBtn  data-social="google"

 [링크]
   #signupLink         → signup
   #findEmailLink      → find-email
   #findPasswordLink   → find-password
   #businessLoginLink  → login-business
================================================================================
-->

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<!-- ?v= 는 캐시 무효화용(2026-08-21) — recommend.html의 같은 위치 주석 참고 -->
<link rel="stylesheet" href="assets/css/eatty.css?v=20260826d">
<script defer src="assets/js/api.js?v=20260822a"></script>
<script defer src="assets/js/eatty-ui.js"></script>
<script defer src="assets/js/login.js"></script>
</head>

<body>
<div class="e-auth">

  <!-- ========================= 좌측 브랜드 비주얼 ========================= -->
  <aside class="e-auth-aside" style="background:linear-gradient(135deg,#c2410c 0%,#fd6d4a 45%,#fea255 100%)">
    <a href="/" class="e-logo relative z-10">
      <span class="e-logo-mark" aria-hidden="true"><img src="img/logo.png" alt="잇티웨이" class="e-logo-img"></span>
      <span class="e-logo-text !text-white">잇티<em class="!text-white !bg-none">웨이</em></span>
    </a>

    <div class="relative z-10 mt-auto">
      <p class="text-white/80 text-sm font-bold tracking-wide">WELCOME BACK</p>
      <h2 class="text-white font-extrabold text-[34px] leading-[1.25] tracking-[-.035em] mt-4">
        오늘 뭐 먹을지<br>고민하지 마세요
      </h2>
      <p class="text-white/85 mt-5 text-[15px] leading-relaxed max-w-sm">
        로그인하면 즐겨찾기, 영수증 인증 리뷰, 음식 취향 찾기 기반 맞춤 추천을 이어서 이용할 수 있어요.
      </p>
    </div>
  </aside>

  <!-- ============================== 우측 폼 ============================== -->
  <main class="e-auth-main">

    <!-- 모바일 상단 바 -->
    <div class="flex items-center justify-between lg:hidden mb-10">
      <a href="/" class="e-logo">
        <span class="e-logo-mark" aria-hidden="true"><img src="img/logo.png" alt="잇티웨이" class="e-logo-img"></span>
        <span class="e-logo-text">잇티<em>웨이</em></span>
      </a>
      <a href="/" class="btn btn-ghost btn-sm">홈으로</a>
    </div>

    <div class="e-auth-card">

      <!-- 회원 유형 전환 -->
      <div class="e-segment w-full mb-8" role="tablist" aria-label="회원 유형 선택">
        <a href="login" class="e-segment-item flex-1 text-center" role="tab" aria-selected="true">일반 회원</a>
        <a href="login-business" class="e-segment-item flex-1 text-center" role="tab" aria-selected="false" id="businessLoginLink">사업자 회원</a>
      </div>

      <h1 class="e-auth-title">로그인</h1>
      <p class="e-auth-sub">잇티웨이 계정으로 계속하기</p>

      <form class="mt-7" id="loginForm" novalidate>

        <div class="e-field">
          <label class="e-label" for="loginEmail">이메일 <span class="req">*</span></label>
          <div class="e-input-wrap has-icon">
            <svg class="e-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/>
            </svg>
            <input type="email" class="e-input" id="loginEmail" name="email"
                   placeholder="eatty@example.com" autocomplete="email" required>
          </div>
          <p class="e-error" id="loginEmailError">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
            올바른 이메일 형식을 입력해주세요.
          </p>
        </div>

        <div class="e-field">
          <label class="e-label" for="loginPassword">
            비밀번호 <span class="req">*</span>
            <a href="find-password" class="e-label-side hover:text-[var(--brand-600)]" id="findPasswordLink">비밀번호를 잊으셨나요?</a>
          </label>
          <div class="e-input-wrap has-icon has-suffix">
            <svg class="e-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
            </svg>
            <input type="password" class="e-input" id="loginPassword" name="password"
                   placeholder="비밀번호 입력" autocomplete="current-password" required>
            <span class="e-input-suffix">
              <button type="button" class="e-eye" id="togglePasswordBtn" data-password-toggle="loginPassword" aria-label="비밀번호 표시">
                <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.6 6.2A9.6 9.6 0 0 1 12 6c6.4 0 10 6 10 6a17 17 0 0 1-2.4 3M6.3 7.8A16.6 16.6 0 0 0 2 12s3.6 6 10 6c1.6 0 3-.3 4.2-.9"/><path d="M3 3l18 18"/></svg>
              </button>
            </span>
          </div>
          <p class="e-error" id="loginPasswordError">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
            비밀번호를 입력해주세요.
          </p>
        </div>

        <div class="flex items-center justify-between mb-6">
          <label class="e-check" for="rememberMe">
            <input type="checkbox" id="rememberMe" name="rememberMe" value="true">
            <span>로그인 상태 유지</span>
          </label>
          <a href="find-email" class="e-link text-[13px]" id="findEmailLink">이메일 찾기</a>
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-block" id="loginSubmitBtn">로그인</button>
      </form>

      <div class="e-divider">또는 소셜 계정으로</div>

      <div class="space-y-2.5">
        <button type="button" class="btn-social btn-social--kakao" id="kakaoLoginBtn" data-social="kakao">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 3C6.9 3 2.8 6.3 2.8 10.3c0 2.6 1.7 4.9 4.3 6.2-.2.7-.7 2.5-.8 2.9-.1.5.2.5.4.4.2-.1 2.6-1.8 3.7-2.5.5.1 1.1.1 1.6.1 5.1 0 9.2-3.3 9.2-7.1S17.1 3 12 3Z"/>
          </svg>
          카카오로 계속하기
        </button>

        <button type="button" class="btn-social btn-social--naver" id="naverLoginBtn" data-social="naver">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M4 4h5.3l4.9 7.1V4H20v16h-5.3l-4.9-7.1V20H4V4Z"/>
          </svg>
          네이버로 계속하기
        </button>

        <button type="button" class="btn-social btn-social--google" id="googleLoginBtn" data-social="google">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.9h5.4c-.2 1.2-1 2.3-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.4Z"/>
            <path fill="#34A853" d="M12 22c2.7 0 4.9-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.7-5.6-4.1H3.1v2.6C4.8 19.9 8.1 22 12 22Z"/>
            <path fill="#FBBC05" d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1A10 10 0 0 0 2 12c0 1.6.4 3.2 1.1 4.6L6.4 14Z"/>
            <path fill="#EA4335" d="M12 6c1.5 0 2.8.5 3.8 1.5l2.8-2.8C16.9 3 14.7 2 12 2 8.1 2 4.8 4.1 3.1 7.4L6.4 10C7.2 7.6 9.4 6 12 6Z"/>
          </svg>
          Google로 계속하기
        </button>
      </div>

      <p class="text-center text-sm text-[var(--ink-500)] mt-8">
        아직 계정이 없으신가요?
        <a href="signup" class="e-link-brand ml-1" id="signupLink">회원가입</a>
      </p>

      <div class="mt-8 pt-6 border-t border-[var(--line)] text-center">
        <p class="t-xs">
          로그인 시 <a href="terms-service" class="e-link">이용약관</a> 및
          <a href="terms-privacy" class="e-link">개인정보처리방침</a>에 동의한 것으로 간주됩니다.
        </p>
      </div>
    </div>
  </main>
</div>
</body>
</html>

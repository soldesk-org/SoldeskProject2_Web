<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>사업자 정보 입력 | 잇티웨이</title>
<link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
<div class="flex h-screen w-full overflow-hidden bg-white font-['Inter','Noto_Sans_KR',sans-serif]">
  <div class="relative flex w-full shrink-0 flex-col overflow-y-auto px-10 py-8 lg:w-[31%] lg:min-w-[440px] lg:max-w-[595px] lg:px-14">
    <a href="index" class="flex items-center gap-3">
      <div class="relative size-16 shrink-0 overflow-hidden">
        <img src="assets/images/logo-icon.png" alt="Eatty way 로고" class="absolute left-[-36.79%] top-[-24.44%] size-[173.11%] max-w-none object-cover" />
      </div>
      <span class="bg-gradient-to-r from-[#fd6d4a] to-[#fea255] bg-clip-text text-[36px] font-bold tracking-[-1.8px] text-transparent">Eatty way</span>
    </a>

    <div class="flex flex-1 flex-col justify-center py-8">
      <div class="text-[#25374b]">
        <h1 class="text-[30px] font-semibold leading-tight tracking-[-1.5px]">사업자 정보 입력</h1>
        <p class="mt-3 text-[18px] font-medium leading-normal tracking-[-0.9px] opacity-80">사업자 회원 정보를 입력해주세요.</p>
      </div>

      <form id="signup-business-info-form" data-next="signup-business-done" class="mt-8 flex flex-col gap-3">
        <label class="text-[18px] font-medium tracking-[-0.9px] text-[#25374b]">상호명 (닉네임으로 사용됩니다)</label>
        <input id="biz-nickname" placeholder="상호명을 입력해주세요." class="h-[52px] w-full rounded-[10px] border border-[rgba(37,55,75,0.7)] bg-white px-6 text-[18px] font-medium tracking-[-0.9px] text-[#25374b] placeholder:text-[rgba(37,55,75,0.7)] outline-none focus:border-[#fd6d4a]" />

        <label class="mt-2 text-[18px] font-medium tracking-[-0.9px] text-[#25374b]">대표자명</label>
        <input id="biz-owner-name" placeholder="대표자명을 입력해주세요. (사업자등록증명원으로 대조됩니다)" class="h-[52px] w-full rounded-[10px] border border-[rgba(37,55,75,0.7)] bg-white px-6 text-[18px] font-medium tracking-[-0.9px] text-[#25374b] placeholder:text-[rgba(37,55,75,0.7)] outline-none focus:border-[#fd6d4a]" />

        <label class="mt-2 text-[18px] font-medium tracking-[-0.9px] text-[#25374b]">사업자등록번호</label>
        <input id="biz-number" placeholder="000-00-00000 (사업자등록증명원으로 대조됩니다)" class="h-[52px] w-full rounded-[10px] border border-[rgba(37,55,75,0.7)] bg-white px-6 text-[18px] font-medium tracking-[-0.9px] text-[#25374b] placeholder:text-[rgba(37,55,75,0.7)] outline-none focus:border-[#fd6d4a]" />

        <label class="mt-2 text-[18px] font-medium tracking-[-0.9px] text-[#25374b]">이메일</label>
        <input id="biz-email" type="email" placeholder="이메일을 입력해주세요." class="h-[52px] w-full rounded-[10px] border border-[rgba(37,55,75,0.7)] bg-white px-6 text-[18px] font-medium tracking-[-0.9px] text-[#25374b] placeholder:text-[rgba(37,55,75,0.7)] outline-none focus:border-[#fd6d4a]" />
        <button type="button" id="email-send" class="h-[52px] w-full rounded-[10px] bg-gradient-to-r from-[#fd6d4a] to-[#fea255] text-[20px] font-semibold tracking-[-1px] text-white transition-opacity hover:opacity-90">인증코드 전송</button>
        <div id="email-code-group" style="display:none">
          <label class="mt-2 block text-[18px] font-medium tracking-[-0.9px] text-[#25374b]">인증코드</label>
          <div class="mt-1 flex items-center gap-3">
            <input id="biz-email-code" placeholder="코드를 입력해주세요." class="h-[52px] w-full rounded-[10px] border border-[rgba(37,55,75,0.7)] bg-white px-6 text-[18px] font-medium tracking-[-0.9px] text-[#25374b] placeholder:text-[rgba(37,55,75,0.7)] outline-none focus:border-[#fd6d4a]" />
          </div>
          <button type="button" id="email-confirm" class="mt-2 relative h-[52px] w-full rounded-[10px] border border-[rgba(37,55,75,0.7)] bg-white text-[18px] font-medium tracking-[-0.9px] text-[rgba(37,55,75,0.7)] transition-colors hover:bg-[rgba(37,55,75,0.04)]">인증 확인</button>
          <p id="biz-email-verify-status" class="mt-1 text-[14px] font-medium text-[rgba(37,55,75,0.5)]"></p>
        </div>

        <label class="mt-2 text-[18px] font-medium tracking-[-0.9px] text-[#25374b]">비밀번호</label>
        <input id="biz-password" type="password" placeholder="비밀번호를 입력해주세요." class="h-[52px] w-full rounded-[10px] border border-[rgba(37,55,75,0.7)] bg-white px-6 text-[18px] font-medium tracking-[-0.9px] text-[#25374b] placeholder:text-[rgba(37,55,75,0.7)] outline-none focus:border-[#fd6d4a]" />

        <label class="mt-2 text-[18px] font-medium tracking-[-0.9px] text-[#25374b]">비밀번호 확인</label>
        <input id="biz-password-confirm" type="password" placeholder="비밀번호를 다시 입력해주세요." class="h-[52px] w-full rounded-[10px] border border-[rgba(37,55,75,0.7)] bg-white px-6 text-[18px] font-medium tracking-[-0.9px] text-[#25374b] placeholder:text-[rgba(37,55,75,0.7)] outline-none focus:border-[#fd6d4a]" />

        <label class="mt-2 text-[18px] font-medium tracking-[-0.9px] text-[#25374b]">전화번호</label>
        <input id="biz-phone" placeholder="전화번호를 입력해주세요. ('-' 없이)" class="h-[52px] w-full rounded-[10px] border border-[rgba(37,55,75,0.7)] bg-white px-6 text-[18px] font-medium tracking-[-0.9px] text-[#25374b] placeholder:text-[rgba(37,55,75,0.7)] outline-none focus:border-[#fd6d4a]" />
        <button type="button" id="phone-send" class="h-[52px] w-full rounded-[10px] bg-gradient-to-r from-[#fd6d4a] to-[#fea255] text-[20px] font-semibold tracking-[-1px] text-white transition-opacity hover:opacity-90">인증코드 전송</button>
        <div id="phone-code-group" style="display:none">
          <label class="mt-2 block text-[18px] font-medium tracking-[-0.9px] text-[#25374b]">인증코드</label>
          <div class="mt-1 flex items-center gap-3">
            <input id="biz-phone-code" placeholder="코드를 입력해주세요." class="h-[52px] w-full rounded-[10px] border border-[rgba(37,55,75,0.7)] bg-white px-6 text-[18px] font-medium tracking-[-0.9px] text-[#25374b] placeholder:text-[rgba(37,55,75,0.7)] outline-none focus:border-[#fd6d4a]" />
          </div>
          <button type="button" id="phone-confirm" class="mt-2 relative h-[52px] w-full rounded-[10px] border border-[rgba(37,55,75,0.7)] bg-white text-[18px] font-medium tracking-[-0.9px] text-[rgba(37,55,75,0.7)] transition-colors hover:bg-[rgba(37,55,75,0.04)]">인증 확인</button>
          <p id="biz-phone-verify-status" class="mt-1 text-[14px] font-medium text-[rgba(37,55,75,0.5)]"></p>
        </div>

        <label class="mt-2 text-[18px] font-medium tracking-[-0.9px] text-[#25374b]">사업자등록증명원</label>
        <div class="flex items-center gap-3">
          <button type="button" id="biz-file-btn" class="flex h-[52px] flex-1 items-center gap-3 rounded-[10px] border border-[rgba(37,55,75,0.7)] bg-white px-6 text-[18px] font-medium tracking-[-0.9px] text-[rgba(37,55,75,0.7)] transition-colors hover:bg-[rgba(37,55,75,0.04)]">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0 text-[rgba(37,55,75,0.5)]"><path d="M4 22h14a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v4"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="m3 15 2 2 4-4"/></svg>
            <span id="biz-file-label" class="truncate">파일 선택 (PDF, JPG, PNG)</span>
          </button>
          <input id="biz-file" type="file" accept="image/png,image/jpeg,application/pdf" class="hidden" />
        </div>

        <button type="button" id="biz-verify-btn" disabled class="relative h-[52px] w-full rounded-[10px] border border-[rgba(37,55,75,0.7)] bg-white text-[18px] font-medium tracking-[-0.9px] text-[rgba(37,55,75,0.7)] transition-colors hover:bg-[rgba(37,55,75,0.04)]" style="opacity:0.5">인증하기</button>

        <div id="biz-verified-banner" style="display:none" class="flex items-center gap-2 rounded-[10px] bg-[rgba(254,162,85,0.15)] px-5 py-4 text-[#fd6d4a]">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
          <span class="text-[17px] font-semibold tracking-[-0.85px]">사업자 인증이 완료되었습니다.</span>
        </div>

        <p id="biz-signup-error" class="text-[15px] font-medium text-red-500" style="display:none"></p>
        <div class="mt-4">
          <button type="submit" id="submit-btn" disabled class="h-[52px] w-full rounded-[10px] bg-gradient-to-r from-[#fd6d4a] to-[#fea255] text-[20px] font-semibold tracking-[-1px] text-white transition-opacity hover:opacity-90 opacity-50">가입하기</button>
        </div>
      </form>
    </div>
  </div>

  <div class="relative hidden flex-1 lg:block">
    <img src="assets/images/map.png" alt="맛집 지도" class="absolute inset-0 size-full object-cover" />
  </div>
</div>
<script src="assets/js/api.js"></script>
<script src="assets/js/signup-business-info.js"></script>
</body>
</html>

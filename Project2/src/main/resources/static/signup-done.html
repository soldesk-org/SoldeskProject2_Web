<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>가입 완료 | 잇티웨이</title>
<link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
<div class="flex h-screen w-full overflow-hidden bg-white font-['Inter','Noto_Sans_KR',sans-serif]">
  <div class="relative flex w-full shrink-0 flex-col overflow-y-auto px-10 py-8 lg:w-[31%] lg:min-w-[440px] lg:max-w-[595px] lg:px-14">
    <a href="index" class="flex items-center gap-3">
      <div class="relative size-16 shrink-0 overflow-hidden">
        <img src="assets/images/logo-icon.png" alt="Eatty way 로고" class="absolute left-[-36.79%] top-[-24.44%] size-[173.11%] max-w-none object-cover" />
      </div>
      <span class="bg-gradient-to-r from-[#fd6d4a] to-[#fea255] bg-clip-text text-[36px] font-bold tracking-[-1.8px] text-transparent">Eatty way</span>
    </a>

    <div class="flex flex-1 flex-col justify-center py-8">
      <div class="mx-auto flex size-[180px] items-center justify-center rounded-full bg-[rgba(254,162,85,0.15)]">
        <div class="bg-gradient-to-b from-[#fea255] to-[#fd6d4a] bg-clip-text text-transparent">
          <svg width="80" height="80" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>

      <div class="mt-8 text-center text-[#25374b]">
        <h1 class="text-[30px] font-semibold tracking-[-1.5px]">가입을 축하드립니다!</h1>
        <p class="mt-3 text-[18px] font-medium tracking-[-0.9px] opacity-80">로그인 후 모든 서비스를 이용하실 수 있습니다.</p>
      </div>

      <div class="mt-8 flex flex-col gap-3">
        <a href="login" class="flex h-[52px] w-full items-center justify-center rounded-[10px] bg-gradient-to-r from-[#fd6d4a] to-[#fea255] text-[20px] font-semibold tracking-[-1px] text-white transition-opacity hover:opacity-90">로그인 하기</a>
        <a href="index" class="flex h-[52px] w-full items-center justify-center rounded-[10px] border border-[rgba(37,55,75,0.7)] bg-white text-[18px] font-medium tracking-[-0.9px] text-[rgba(37,55,75,0.7)] transition-colors hover:bg-[rgba(37,55,75,0.04)]">메인으로 이동하기</a>
      </div>
    </div>
  </div>

  <div class="relative hidden flex-1 lg:block">
    <img src="assets/images/map.png" alt="맛집 지도" class="absolute inset-0 size-full object-cover" />
  </div>
</div>
<script src="assets/js/api.js"></script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>잇티웨이</title>
<link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
<div class="relative flex h-screen w-full overflow-hidden bg-white font-['Inter','Noto_Sans_KR',sans-serif]">
  <!-- Sidebar -->
  <aside class="relative z-10 flex w-[316px] shrink-0 flex-col bg-white">
    <a href="index" class="flex justify-center">
      <img src="assets/images/logo-full.png" alt="잇티웨이 로고" class="size-[260px] object-contain" />
    </a>
    <nav class="mt-4 flex flex-col gap-9 px-12">
      <a href="explore" class="flex items-center gap-5 text-[#25374b] transition-opacity hover:opacity-70">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <span class="text-[28px] font-semibold tracking-[-1.4px]">탐색</span>
      </a>
      <a href="recommend" class="flex items-center gap-5 text-[#25374b] transition-opacity hover:opacity-70">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg>
        <span class="text-[28px] font-semibold tracking-[-1.4px]">추천</span>
      </a>
      <a href="login" data-auth="out" class="flex items-center gap-5 text-[#25374b] transition-opacity hover:opacity-70">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="text-[28px] font-semibold tracking-[-1.4px]">로그인</span>
      </a>
      <a href="mypage" data-auth="in" class="flex items-center gap-5 text-[#25374b] transition-opacity hover:opacity-70">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="text-[28px] font-semibold tracking-[-1.4px]">마이페이지</span>
      </a>
      <button type="button" data-auth="in" data-logout-btn class="flex items-center gap-5 text-[#25374b] transition-opacity hover:opacity-70 text-left">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span class="text-[28px] font-semibold tracking-[-1.4px]">로그아웃</span>
      </button>
    </nav>
  </aside>

  <!-- Map + hero -->
  <div class="relative flex-1">
    <img src="assets/images/map.png" alt="맛집 지도" class="absolute inset-0 size-full object-cover" />
    <div class="pointer-events-none absolute inset-y-0 left-0 w-[500px] bg-gradient-to-r from-white via-white/85 to-transparent"></div>
    <div class="absolute left-16 top-[64%] max-w-[680px] text-[#25374b]">
      <h1 class="text-[48px] font-semibold leading-tight tracking-[-2.4px]">내 취향에 딱 맞는 맛집</h1>
      <p class="mt-4 text-[28px] font-medium leading-normal tracking-[-1.4px]">
        AI가 취향과 위치를 분석해<br />오늘 가장 잘 어울리는 맛집을 추천합니다.
      </p>
    </div>
  </div>
</div>
<script src="assets/js/api.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" data-auth-state="guest">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>잇티웨이</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/images/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
<meta name="description" content="Eattyway 서비스 이용약관">

<!--
================================================================================
 terms-service — 서비스 이용약관 (긴 문서 스타일)
--------------------------------------------------------------------------------
 2026-08-06 전면 교체 - 운영팀이 카카오톡으로 전달한 최종본
 (Eattyway_서비스이용약관_2026-08-01.txt) 내용 그대로 반영. 페이지 뼈대(헤더/좌측 목차/카드 레이아웃)는
 그대로 두고 본문/목차 항목만 그 문서의 장(章) 구성(4개 장)에 맞게 교체했다(같은 날 후속 - 인쇄 버튼
 제거, 문의 이메일을 실제 발신 계정(eattyway@daum.net)으로 교체).

 [구조]
   #termsToc          좌측 스티키 목차 (a[href="#chapterN"])
   #termsBody         본문 (.e-doc)
   #chapter1 ~ #chapter4   각 장 앵커
   #versionPicker     현재/과거 버전 선택 select (배지 스타일, 2026-08-14 상단으로 이동)
   #termsEffectiveAt  시행일
   #privacyLink       → terms-privacy
================================================================================
-->

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/css/eatty.css">
<script defer src="assets/js/api.js"></script>
<script defer src="assets/js/eatty-ui.js"></script>
<link rel="stylesheet" href="assets/css/terms-service.css">
</head>

<body class="min-h-screen flex flex-col">

<!-- ============================== 헤더 ============================== -->
<header class="e-header e-header--solid">
  <div class="e-container e-header-inner">
    <a href="/" class="e-logo">
      <span class="e-logo-mark" aria-hidden="true"><img src="img/logo.png" alt="잇티웨이" class="e-logo-img"></span>
      <span class="e-logo-text">잇티<em>웨이</em></span>
    </a>
    <nav class="e-nav">
      <a class="e-nav-link is-active" href="terms-service">이용약관</a>
      <a class="e-nav-link" href="terms-privacy" id="privacyLink">개인정보처리방침</a>
    </nav>
    <div class="e-header-actions">
      <a href="/" class="btn btn-ghost btn-sm">홈으로</a>
    </div>
  </div>
</header>

<main class="flex-1 bg-[var(--bg-soft)]">

  <!-- 문서 헤딩 -->
  <div class="bg-white border-b border-[var(--line)]">
    <div class="e-container py-10 md:py-14">
      <h1 class="t-h2">Eattyway 서비스 이용약관</h1>

      <div class="flex flex-wrap items-center gap-x-5 gap-y-2 mt-5">
        <!-- 2026-08-14 — 버전 배지를 클릭하면 바로 지난 버전을 고를 수 있게(select), 예전엔 페이지 맨
             아래에 별도 드롭다운이 있었는데 너무 눈에 안 띈다는 피드백으로 상단 배지 자리로 옮겼다. -->
        <select id="versionPicker" class="e-badge e-badge--brand e-badge-lg e-version-select">
          <option value="">불러오는 중...</option>
        </select>
        <p class="t-sm">시행일 <b class="t-strong t-num" id="termsEffectiveAt">2026년 8월 1일</b></p>
      </div>
    </div>
  </div>

  <div class="e-container py-10 md:py-14">
    <div class="grid grid-cols-1 lg:grid-cols-[240px_1fr] gap-8 lg:gap-12">

      <!-- ==================== 좌측 목차 ==================== -->
      <aside class="no-print">
        <nav class="e-sticky-top" id="termsToc" aria-label="약관 목차">
          <p class="text-[11px] font-extrabold text-[var(--ink-400)] tracking-wider uppercase px-3 mb-2">목차</p>
          <!-- 2026-08-14 — 목차는 더 이상 정적 HTML이 아니라 서버(GET /api/terms/SERVICE)가 내려주는
               content 안의 h2 태그를 훑어서 terms-service.js가 자동 생성한다(과거 버전을 봐도 그 버전의
               실제 장 구성대로 목차가 바뀌도록). -->
        </nav>
      </aside>

      <!-- ==================== 본문 ==================== -->
      <article class="e-card e-card-pad">
        <div class="e-doc" id="termsBody">
          <p class="t-sm">불러오는 중...</p>
        </div>
      </article>
    </div>
  </div>
</main>

<footer class="e-footer">
  <div class="e-container">
    <div class="e-footer-bottom !mt-0 !border-0 !pt-0">
      <p>&copy; 2026 Eatty way. All rights reserved.</p>
      <nav class="flex gap-5">
        <a href="terms-service">이용약관</a>
        <a href="terms-privacy">개인정보처리방침</a>
        <a href="/">홈</a>
      </nav>
    </div>
  </div>
</footer>

<script defer src="assets/js/terms-service.js"></script>
</body>
</html>

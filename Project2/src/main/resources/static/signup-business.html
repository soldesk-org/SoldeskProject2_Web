<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>사업자 회원가입 | 잇티웨이</title>
<link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
<div class="flex h-screen w-full overflow-hidden bg-white font-['Inter','Noto_Sans_KR',sans-serif]">
  <div class="relative flex w-full shrink-0 flex-col overflow-y-auto px-10 py-8 lg:w-[31%] lg:min-w-[440px] lg:max-w-[595px] lg:px-14">
    <a href="index" class="flex items-center gap-3">
      <div class="relative size-16 shrink-0 overflow-hidden">
        <img src="assets/images/logo-icon.png" alt="Eatty way 로고" class="absolute left-[-36.79%] top-[-24.44%] size-[173.11%] max-w-none object-cover" />
      </div>
      <span class="bg-gradient-to-r from-[#fd6d4a] to-[#fea255] bg-clip-text text-[36px] font-bold tracking-[-1.8px] text-transparent">Eatty way</span>
    </a>

    <div class="flex flex-1 flex-col justify-center py-8">
      <div class="text-[#25374b]">
        <h1 class="text-[30px] font-semibold leading-tight tracking-[-1.5px]">사업자 회원가입</h1>
        <p class="mt-3 text-[18px] font-medium leading-normal tracking-[-0.9px] opacity-80">회원가입을 위해 약관에 동의해주세요.</p>
      </div>

      <div class="mt-8 rounded-[10px] border border-[rgba(37,55,75,0.7)] p-8">
        <div class="flex items-center gap-4">
          <button type="button" id="check-all" class="flex size-[25px] shrink-0 items-center justify-center rounded-[7px] border border-[rgba(37,55,75,0.7)] bg-white"></button>
          <span class="text-[20px] font-semibold tracking-[-1px] text-[#25374b]">전체 동의하기</span>
        </div>

        <div class="my-6 h-px w-full bg-[rgba(37,55,75,0.15)]"></div>

        <div class="flex items-center gap-4">
          <button type="button" id="check-service" class="flex size-[25px] shrink-0 items-center justify-center rounded-[7px] border border-[rgba(37,55,75,0.7)] bg-white"></button>
          <span class="flex-1 text-[18px] font-medium tracking-[-0.9px]">
            <span class="text-[#fd6d4a]">필수</span>&nbsp;&nbsp;<span class="font-semibold text-[#25374b]">서비스 이용약관</span>
          </span>
          <a href="terms-service" class="text-[16px] font-medium tracking-[-0.8px] text-[rgba(37,55,75,0.7)] underline">보기</a>
        </div>

        <div class="mt-6 flex items-center gap-4">
          <button type="button" id="check-privacy" class="flex size-[25px] shrink-0 items-center justify-center rounded-[7px] border border-[rgba(37,55,75,0.7)] bg-white"></button>
          <span class="flex-1 text-[18px] font-medium tracking-[-0.9px]">
            <span class="text-[#fd6d4a]">필수</span>&nbsp;&nbsp;<span class="font-semibold text-[#25374b]">개인정보 처리방침</span>
          </span>
          <a href="terms-privacy" class="text-[16px] font-medium tracking-[-0.8px] text-[rgba(37,55,75,0.7)] underline">보기</a>
        </div>

        <div class="mt-8">
          <button type="button" id="next-btn" data-next="signup-business-info" disabled class="h-[52px] w-full rounded-[10px] bg-gradient-to-r from-[#fd6d4a] to-[#fea255] text-[20px] font-semibold tracking-[-1px] text-white transition-opacity hover:opacity-90 opacity-50">다음</button>
        </div>

        <div class="mt-6 text-center">
          <a href="signup" class="text-[18px] font-medium tracking-[-0.9px] text-[#25374b]">개인 회원가입 이동</a>
        </div>
      </div>
    </div>
  </div>

  <div class="relative hidden flex-1 lg:block">
    <img src="assets/images/map.png" alt="맛집 지도" class="absolute inset-0 size-full object-cover" />
  </div>
</div>
<script src="assets/js/api.js"></script>
<script src="assets/js/signup-terms.js"></script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>이메일 찾기 결과 | 잇티웨이</title>
<link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
<div class="flex h-screen w-full overflow-hidden bg-white font-['Inter','Noto_Sans_KR',sans-serif]">
  <div class="relative flex w-full shrink-0 flex-col overflow-y-auto px-10 py-8 lg:w-[31%] lg:min-w-[440px] lg:max-w-[595px] lg:px-14">
    <a href="index" class="flex items-center gap-3">
      <div class="relative size-16 shrink-0 overflow-hidden">
        <img src="assets/images/logo-icon.png" alt="Eatty way 로고" class="absolute left-[-36.79%] top-[-24.44%] size-[173.11%] max-w-none object-cover" />
      </div>
      <span class="bg-gradient-to-r from-[#fd6d4a] to-[#fea255] bg-clip-text text-[36px] font-bold tracking-[-1.8px] text-transparent">Eatty way</span>
    </a>

    <div class="flex flex-1 flex-col justify-center py-8">
      <div class="mx-auto flex size-[180px] items-center justify-center rounded-full bg-[rgba(254,162,85,0.15)]">
        <div class="bg-gradient-to-b from-[#fea255] to-[#fd6d4a] bg-clip-text text-transparent">
          <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        </div>
      </div>

      <div class="mt-8 text-center text-[#25374b]">
        <h1 class="text-[30px] font-semibold tracking-[-1.5px]">가입하신 이메일 입니다!</h1>
        <p class="mt-3 text-[18px] font-medium tracking-[-0.9px] opacity-80">회원님의 이메일을 확인해주세요.</p>
      </div>

      <div id="fer-email" class="mt-8 flex h-[52px] w-full items-center justify-center rounded-[10px] bg-[rgba(254,162,85,0.15)] text-[18px] font-semibold tracking-[-0.9px] text-[#25374b]"></div>

      <div class="mt-6 flex flex-col gap-3">
        <a href="login" class="flex h-[52px] w-full items-center justify-center rounded-[10px] bg-gradient-to-r from-[#fd6d4a] to-[#fea255] text-[20px] font-semibold tracking-[-1px] text-white transition-opacity hover:opacity-90">로그인 하러 가기</a>
        <a href="find-email" class="flex h-[52px] w-full items-center justify-center rounded-[10px] border border-[rgba(37,55,75,0.7)] bg-white text-[18px] font-medium tracking-[-0.9px] text-[rgba(37,55,75,0.7)] transition-colors hover:bg-[rgba(37,55,75,0.04)]">다시 찾기</a>
      </div>

      <p class="mt-6 text-center text-[16px] font-medium tracking-[-0.8px] text-[rgba(37,55,75,0.7)]">
        비밀번호를 잊으셨나요?&nbsp;&nbsp;<a href="find-password" class="bg-gradient-to-r from-[rgba(253,109,74,0.7)] to-[rgba(254,162,85,0.7)] bg-clip-text font-medium text-transparent">비밀번호 찾기</a>
      </p>
    </div>
  </div>

  <div class="relative hidden flex-1 lg:block">
    <img src="assets/images/map.png" alt="맛집 지도" class="absolute inset-0 size-full object-cover" />
  </div>
</div>
<script src="assets/js/api.js"></script>
<script>
  document.getElementById("fer-email").textContent = sessionStorage.getItem("fe_email") || "-";
  sessionStorage.removeItem("fe_verification_token");
  sessionStorage.removeItem("fe_phone");
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko" data-auth-state="guest">
<head>
<meta charset="UTF-8">
<!-- 페이지 전환 흰 번쩍임 방지(2026-08-21) — index.html의 같은 위치 주석 참고 -->
<style>html{background-color:#f8f7fb}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>잇티웨이</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/images/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
<meta name="description" content="찾은 이메일 계정 정보입니다.">

<!--
================================================================================
 find-email-result — 이메일 찾기 STEP 3 : 결과
--------------------------------------------------------------------------------
 [스테퍼]  #findEmailSteps  (1 완료 / 2 완료 / 3 현재)

 [출력]  ★ 서버 응답으로 채워주세요. 계정이 여러 개면 #foundAccountList 안에 반복 렌더
   #foundAccountList        찾은 계정 목록 컨테이너
   .js-found-email          이메일 텍스트 (data-email="원본 이메일")
   .js-found-joined         가입일
   .js-found-type           계정 유형 배지 (일반 / 사업자)
   #foundCount              찾은 계정 수

 [액션]
   #copyEmailBtn            이메일 복사 (버튼마다 data-copy-target 사용)
   #goLoginWithEmailBtn     이 이메일로 로그인 → login?email=...
   #goFindPasswordBtn       비밀번호도 잊은 경우 → find-password
================================================================================
-->

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<!-- ?v= 는 캐시 무효화용(2026-08-21) — recommend.html의 같은 위치 주석 참고 -->
<link rel="stylesheet" href="assets/css/eatty.css?v=20260821b">
<script defer src="assets/js/api.js?v=20260821c"></script>
<script defer src="assets/js/eatty-ui.js"></script>
<script defer src="assets/js/find-email-result.js"></script>
</head>

<body class="min-h-screen flex flex-col bg-[var(--bg-soft)]">

<header class="e-header e-header--solid">
  <div class="e-container e-header-inner">
    <a href="/" class="e-logo">
      <span class="e-logo-mark" aria-hidden="true"><img src="img/logo.png" alt="잇티웨이" class="e-logo-img"></span>
      <span class="e-logo-text">잇티<em>웨이</em></span>
    </a>
    <div class="e-header-actions">
      <a href="/" class="btn btn-ghost btn-sm">홈으로</a>
    </div>
  </div>
</header>

<main class="flex-1 grid place-items-center py-12 px-5">
  <div class="w-full" style="max-width:520px">
    <div class="e-card e-card-flat p-4 mb-5">
      <div class="e-steps" id="findEmailSteps">
        <div class="e-step is-done">
          <span class="e-step-dot">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </span>
          <span class="e-step-label">정보 입력</span>
        </div>
        <span class="e-step-line" style="background:var(--brand-300)"></span>
        <div class="e-step is-done">
          <span class="e-step-dot">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </span>
          <span class="e-step-label">본인 인증</span>
        </div>
        <span class="e-step-line" style="background:var(--brand-300)"></span>
        <div class="e-step is-current">
          <span class="e-step-dot">3</span>
          <span class="e-step-label">결과 확인</span>
        </div>
      </div>
    </div>

    <!-- ==================== 찾은 계정 목록 ==================== -->
    <div class="e-card e-card-pad">
      <div id="foundAccountList" class="space-y-3">

        <!-- 계정 카드 (여러 개면 이 블록을 반복) -->
        <div class="p-5 rounded-[var(--r-md)]" style="border:1px solid var(--brand-100)">
          <div class="flex items-center gap-2 mb-3">
            <span class="e-badge e-badge--brand js-found-type">일반 회원</span>
            <span class="t-xs ml-auto">가입일 <b class="t-num js-found-joined">2025-04-18</b></span>
          </div>
          <div class="flex items-center gap-3">
            <span class="w-10 h-10 rounded-[12px] grid place-items-center flex-none bg-white" style="color:var(--brand-500)">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3.5 7 8.5 6 8.5-6"/>
              </svg>
            </span>
            <p class="text-[17px] font-extrabold text-[var(--ink-900)] break-all js-found-email" data-email="eatty@example.com">eatty@example.com</p>
            <button type="button" class="e-icon-btn !w-9 !h-9 flex-none ml-auto" id="copyEmailBtn" data-copy-target="eatty@example.com" aria-label="이메일 복사">
              <svg style="width:17px;height:17px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="mt-6 flex flex-col gap-2.5">
        <a href="login" class="btn btn-primary btn-lg btn-block" id="goLoginWithEmailBtn">이 이메일로 로그인</a>
        <a href="find-password" class="btn btn-outline btn-block" id="goFindPasswordBtn">비밀번호도 잊으셨나요?</a>
      </div>
    </div>
  </div>
</main>

<footer class="py-8 border-t border-[var(--line)] bg-white">
  <div class="e-container flex flex-wrap items-center justify-between gap-3">
    <p class="t-xs">&copy; 2026 Eatty way.</p>
    <nav class="flex gap-4 t-xs">
      <a href="terms-service" class="e-link">이용약관</a>
      <a href="terms-privacy" class="e-link">개인정보처리방침</a>
    </nav>
  </div>
</footer>


</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>AI 고객센터 챗봇 테스트</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 20px; }
  #log { border: 1px solid #ddd; border-radius: 8px; height: 420px; overflow-y: auto; padding: 12px; margin-bottom: 12px; background: #fafafa; }
  .msg { margin-bottom: 12px; line-height: 1.5; white-space: pre-wrap; }
  .msg.user { text-align: right; }
  .msg.user .bubble { background: linear-gradient(135deg, #fd6d4a, #fea255); color: #fff; }
  .msg.bot .bubble { background: #fff; border: 1px solid #ddd; }
  .msg.error .bubble { background: #fee; border: 1px solid #f99; color: #a00; }
  .bubble { display: inline-block; padding: 8px 12px; border-radius: 12px; max-width: 80%; }
  .bubble strong { font-weight: 700; }
  form { display: flex; gap: 8px; }
  input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
  button { padding: 10px 16px; border: none; border-radius: 6px; background: #fd6d4a; color: #fff; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #end-btn { background: #888; margin-left: 8px; }
  #ended-banner { display:none; text-align:center; color:#a00; font-size:13px; margin-bottom:12px; }

  /* 응답 대기 중 표시 */
  .typing .bubble { display: flex; align-items: center; gap: 6px; color: #888; }
  .typing-dots { display: inline-flex; gap: 3px; }
  .typing-dots span {
    width: 6px; height: 6px; border-radius: 50%; background: #bbb;
    animation: typing-bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }
</style>
</head>
<body>
<h1>잇티웨이 AI 고객센터 챗봇 (테스트)</h1>
<p style="color:#666;font-size:13px;">로그인 없이 누구나 문의 가능 — HyperCLOVA X 연동 테스트 페이지</p>
<div id="ended-banner">상담이 종료되었습니다. 이전 대화 내용은 더 이상 볼 수 없습니다.</div>
<div id="log"></div>
<form id="chat-form">
  <input type="text" id="message-input" placeholder="궁금한 점을 입력하세요" autocomplete="off" required />
  <button type="submit" id="send-btn">전송</button>
  <button type="button" id="end-btn">상담종료</button>
</form>

<script>
  const log = document.getElementById("log");
  const form = document.getElementById("chat-form");
  const input = document.getElementById("message-input");
  const sendBtn = document.getElementById("send-btn");
  const endBtn = document.getElementById("end-btn");
  const endedBanner = document.getElementById("ended-banner");

  // 브라우저 탭 하나당 하나의 상담 세션 — 로그를 세션 단위로 묶어 남기기 위한 식별자일 뿐, 인증 토큰이 아니다.
  let sessionId = crypto.randomUUID();
  let ended = false;

  function endSession(reason) {
    if (ended) return;
    ended = true;
    const payload = JSON.stringify({ sessionId, reason });
    // 페이지가 닫히는 중일 수도 있어 fetch 대신 sendBeacon으로 신뢰성 있게 전송
    navigator.sendBeacon("/api/support-chat/end", new Blob([payload], { type: "application/json" }));
  }

  function endSessionFromButton() {
    if (ended) return;
    endSession("button");
    log.innerHTML = "";
    endedBanner.style.display = "block";
    input.disabled = true;
    sendBtn.disabled = true;
    endBtn.disabled = true;
  }

  endBtn.addEventListener("click", endSessionFromButton);
  window.addEventListener("pagehide", () => endSession("page_closed"));

  function escapeHtml(text) {
    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  // "**굵게**" 마크다운만 <strong>으로 바꿔서 렌더링(그 외 HTML은 이스케이프해서 안전하게 처리)
  function renderBotText(text) {
    return escapeHtml(text).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  }

  function addMessage(text, cls) {
    const wrap = document.createElement("div");
    wrap.className = "msg " + cls;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    if (cls === "bot") {
      bubble.innerHTML = renderBotText(text);
    } else {
      bubble.textContent = text;
    }
    wrap.appendChild(bubble);
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
    return wrap;
  }

  function addTypingIndicator() {
    const wrap = document.createElement("div");
    wrap.className = "msg bot typing";
    wrap.innerHTML =
      '<div class="bubble">답변하고 있어요, 잠시만 기다려주세요' +
      '<span class="typing-dots"><span></span><span></span><span></span></span></div>';
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
    return wrap;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (ended) return;
    const message = input.value.trim();
    if (!message) return;
    addMessage(message, "user");
    input.value = "";
    sendBtn.disabled = true;

    const typingEl = addTypingIndicator();

    try {
      const res = await fetch("/api/support-chat/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, sessionId }),
      });
      const data = await res.json();
      typingEl.remove();
      if (res.ok && data.success) {
        addMessage(data.answer, "bot");
      } else {
        addMessage(data.message || "오류가 발생했습니다.", "error");
      }
    } catch (err) {
      typingEl.remove();
      addMessage("네트워크 오류: " + err.message, "error");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>

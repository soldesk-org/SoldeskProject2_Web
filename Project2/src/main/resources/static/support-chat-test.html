<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>AI 고객센터 챗봇 테스트</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 20px; }
  #log { border: 1px solid #ddd; border-radius: 8px; height: 420px; overflow-y: auto; padding: 12px; margin-bottom: 12px; background: #fafafa; }
  .msg { margin-bottom: 12px; line-height: 1.5; white-space: pre-wrap; }
  .msg.user { text-align: right; }
  .msg.user .bubble { background: linear-gradient(135deg, #fd6d4a, #fea255); color: #fff; }
  .msg.bot .bubble { background: #fff; border: 1px solid #ddd; }
  .msg.error .bubble { background: #fee; border: 1px solid #f99; color: #a00; }
  .bubble { display: inline-block; padding: 8px 12px; border-radius: 12px; max-width: 80%; }
  form { display: flex; gap: 8px; }
  input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
  button { padding: 10px 16px; border: none; border-radius: 6px; background: #fd6d4a; color: #fff; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<h1>잇티웨이 AI 고객센터 챗봇 (테스트)</h1>
<p style="color:#666;font-size:13px;">로그인 없이 누구나 문의 가능 — HyperCLOVA X 연동 테스트 페이지</p>
<div id="log"></div>
<form id="chat-form">
  <input type="text" id="message-input" placeholder="궁금한 점을 입력하세요" autocomplete="off" required />
  <button type="submit" id="send-btn">전송</button>
</form>

<script>
  const log = document.getElementById("log");
  const form = document.getElementById("chat-form");
  const input = document.getElementById("message-input");
  const sendBtn = document.getElementById("send-btn");

  function addMessage(text, cls) {
    const wrap = document.createElement("div");
    wrap.className = "msg " + cls;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    wrap.appendChild(bubble);
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    addMessage(message, "user");
    input.value = "";
    sendBtn.disabled = true;

    try {
      const res = await fetch("/api/support-chat/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message }),
      });
      const data = await res.json();
      if (res.ok && data.success) {
        addMessage(data.answer, "bot");
      } else {
        addMessage(data.message || "오류가 발생했습니다.", "error");
      }
    } catch (err) {
      addMessage("네트워크 오류: " + err.message, "error");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>

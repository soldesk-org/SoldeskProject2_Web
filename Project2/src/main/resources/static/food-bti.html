<!DOCTYPE html>
<html lang="ko">
<head>

    <link rel="stylesheet" href="/css/food-bti.css">

<body>
<div class="page">
    <aside class="sidebar">
        <div class="logo">
            <div class="logo-mark">&#x1F374;</div>
            <strong>&#xC787;&#xD2F0;&#xC6E8;&#xC774;</strong>

        <nav class="menu">

            <a href="#">&#xB9C8;&#xC774;&#xD398;&#xC774;&#xC9C0;</a>
        </nav>
    </aside>

    <main class="map-area">
        <div class="map-overlay"></div>
        <div class="map-pin pin-large"><span>&#x1F374;</span></div>
        <div class="map-pin pin-one"><span>&#x1F374;</span></div>
        <div class="map-pin pin-two"><span>&#x1F374;</span></div>
        <div class="map-pin pin-three"><span>&#x1F374;</span></div>

        <section id="startScreen" class="card start-card">
            <p class="label">&#xC785;&#xB9DB; &#xC720;&#xD615; &#xCC3E;&#xAE30;</p>
            <h1>&#xB0B4; &#xC785;&#xB9DB;&#xC740; &#xC5B4;&#xB5A4; &#xC720;&#xD615;&#xC77C;&#xAE4C;?</h1>

                <button class="sub-btn" type="button" onclick="cancelTest()">&#xCDE8;&#xC18C;</button>

        </section>

        <section id="questionScreen" class="card question-card hidden">
            <p class="label">&#xC785;&#xB9DB; &#xC720;&#xD615; &#xCC3E;&#xAE30;</p>

        <section id="resultScreen" class="card result-card hidden">
            <p class="label">&#xB098;&#xC758; &#xC785;&#xB9DB; &#xC720;&#xD615;</p>
            <h1 id="resultType" class="result-type"></h1>
            <h2 id="resultName" class="result-name"></h2>
            <p id="resultText" class="result-text"></p>

            <h3>&#xCD94;&#xCC9C; &#xC74C;&#xC2DD;</h3>
            <div id="foodList" class="food-list"></div>

            <div class="button-row result-buttons">
                <button class="primary-btn" type="button" onclick="restartTest()">&#xB2E4;&#xC2DC; &#xD558;&#xAE30;</button>
                <button class="sub-btn" type="button" onclick="closeResult()">&#xB2EB;&#xAE30;</button>

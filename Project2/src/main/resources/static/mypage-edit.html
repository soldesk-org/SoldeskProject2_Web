<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>회원정보 수정 | 잇티웨이</title>
<link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
<div class="flex h-screen w-full overflow-hidden bg-white font-['Inter','Noto_Sans_KR',sans-serif]">
  <aside class="relative z-10 flex w-[280px] shrink-0 flex-col bg-white">
    <a href="explore" class="flex justify-center">
      <img src="assets/images/logo-full.png" alt="잇티웨이 로고" class="size-[220px] object-contain" />
    </a>
    <nav class="mt-2 flex flex-col gap-4 overflow-y-auto px-6 pb-6">
      <a href="explore" data-nav="explore" class="flex items-center gap-4 rounded-[10px] px-3 py-3 transition-colors">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <span class="whitespace-nowrap text-[22px] font-semibold tracking-[-1.1px]">탐색</span>
      </a>
      <a href="recommend" data-nav="recommend" class="flex items-center gap-4 rounded-[10px] px-3 py-3 transition-colors">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg>
        <span class="whitespace-nowrap text-[22px] font-semibold tracking-[-1.1px]">추천</span>
      </a>
      <a href="mypage?tab=favorites" data-nav="mypage?tab=favorites" class="flex items-center gap-4 rounded-[10px] px-3 py-3 transition-colors">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        <span class="whitespace-nowrap text-[22px] font-semibold tracking-[-1.1px]">즐겨찾기</span>
      </a>
      <a href="taste-quiz" data-nav="taste-quiz" class="flex items-center gap-4 rounded-[10px] px-3 py-3 transition-colors">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
        <span class="whitespace-nowrap text-[22px] font-semibold tracking-[-1.1px]">입맛 유형 찾기</span>
      </a>
      <a href="mypage" data-nav="mypage" class="flex items-center gap-4 rounded-[10px] px-3 py-3 transition-colors">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="whitespace-nowrap text-[22px] font-semibold tracking-[-1.1px]">마이페이지</span>
      </a>
      <a href="chat" data-nav="chat" class="flex items-center gap-4 rounded-[10px] px-3 py-3 transition-colors">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
        <span class="whitespace-nowrap text-[22px] font-semibold tracking-[-1.1px]">잇티챗</span>
      </a>
      <a href="business-mypage" data-nav="business-mypage" data-role="BUSINESS" class="flex items-center gap-4 rounded-[10px] px-3 py-3 transition-colors">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/><path d="M22 7v3a2 2 0 0 1-2 2a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12a2 2 0 0 1-2-2V7"/></svg>
        <span class="whitespace-nowrap text-[22px] font-semibold tracking-[-1.1px]">사업자</span>
      </a>
      <a href="admin" data-nav="admin" data-role="ADMIN" class="flex items-center gap-4 rounded-[10px] px-3 py-3 transition-colors">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><path d="M12 2a5 5 0 0 0-5 5v2a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2V7a5 5 0 0 0-5-5Z"/><path d="M9 7a3 3 0 0 1 6 0v2H9Z"/></svg>
        <span class="whitespace-nowrap text-[22px] font-semibold tracking-[-1.1px]">관리자 전용</span>
      </a>
      <button type="button" data-logout-btn class="flex items-center gap-4 rounded-[10px] px-3 py-3 text-left transition-colors text-[rgba(37,55,75,0.6)] hover:bg-[rgba(254,162,85,0.1)]">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span class="whitespace-nowrap text-[22px] font-semibold tracking-[-1.1px]">로그아웃</span>
      </button>
    </nav>
  </aside>

  <div class="flex min-h-0 flex-1 items-center justify-center overflow-hidden bg-[#fafafa] p-8">
    <!-- 비밀번호 확인 게이트 -->
    <div id="gate-view" class="w-full max-w-[420px] rounded-[16px] border border-[rgba(37,55,75,0.1)] bg-white p-8 shadow-[0px_4px_20px_0px_rgba(0,0,0,0.06)]">
      <h1 class="text-[26px] font-semibold tracking-[-1.3px] text-[#25374b]">본인 확인</h1>
      <p class="mt-2 text-[16px] font-medium text-[rgba(37,55,75,0.6)]">회원정보 수정을 위해 비밀번호를 다시 입력해주세요.</p>
      <form id="gate-form" class="mt-6 flex flex-col gap-3">
        <input id="gate-password" type="password" placeholder="비밀번호" class="h-[48px] w-full rounded-[10px] border border-[rgba(37,55,75,0.2)] bg-white px-5 text-[16px] font-medium text-[#25374b] outline-none focus:border-[#fd6d4a]" />
        <p id="gate-error" class="text-[14px] font-medium text-red-500" style="display:none"></p>
        <button type="submit" id="gate-submit-btn" class="h-[48px] w-full rounded-[10px] bg-gradient-to-r from-[#fd6d4a] to-[#fea255] text-[17px] font-semibold text-white transition-opacity hover:opacity-90">확인</button>
        <a href="mypage" class="text-center text-[15px] font-medium text-[rgba(37,55,75,0.5)] hover:text-[#25374b]">취소하고 돌아가기</a>
      </form>
    </div>

    <!-- 정보 수정 폼 -->
    <div id="edit-view" style="display:none" class="grid w-full max-w-[820px] grid-cols-1 gap-6 rounded-[16px] border border-[rgba(37,55,75,0.1)] bg-white p-8 shadow-[0px_4px_20px_0px_rgba(0,0,0,0.06)] md:grid-cols-[auto_1fr]">
      <div class="flex flex-col items-center gap-3 md:w-[140px]">
        <div id="edit-avatar" class="relative size-[110px] shrink-0 overflow-hidden rounded-full"></div>
        <input id="avatar-input" type="file" accept="image/png,image/jpeg" class="hidden" />
        <button type="button" id="avatar-change-btn" class="w-full rounded-[8px] border border-[rgba(37,55,75,0.2)] px-3 py-1.5 text-[13px] font-semibold text-[#25374b] hover:bg-[rgba(254,162,85,0.08)]">사진 변경</button>
        <button type="button" id="avatar-remove-btn" class="w-full rounded-[8px] px-3 py-1.5 text-[13px] font-medium text-[rgba(37,55,75,0.5)] hover:text-red-500">사진 삭제</button>
      </div>

      <div class="min-w-0">
        <div class="flex items-center justify-between">
          <h1 class="text-[24px] font-semibold tracking-[-1.2px] text-[#25374b]">회원정보 수정</h1>
          <a href="mypage" class="text-[15px] font-medium text-[rgba(37,55,75,0.5)] hover:text-[#25374b]">✕ 닫기</a>
        </div>

        <div class="mt-4 grid grid-cols-1 gap-3 sm:grid-cols-2">
          <div>
            <label class="text-[13px] font-semibold text-[rgba(37,55,75,0.5)]">닉네임</label>
            <input id="edit-nickname" class="mt-1 h-[42px] w-full rounded-[8px] border border-[rgba(37,55,75,0.2)] px-3 text-[15px] font-medium text-[#25374b] outline-none focus:border-[#fd6d4a]" />
          </div>
          <div>
            <label class="text-[13px] font-semibold text-[rgba(37,55,75,0.5)]">전화번호</label>
            <div class="mt-1 flex gap-2">
              <input id="edit-phone" class="h-[42px] w-full rounded-[8px] border border-[rgba(37,55,75,0.2)] px-3 text-[15px] font-medium text-[#25374b] outline-none focus:border-[#fd6d4a]" />
              <button type="button" id="phone-send-btn" class="shrink-0 rounded-[8px] border border-[rgba(37,55,75,0.2)] px-3 text-[13px] font-semibold text-[#25374b] hover:bg-[rgba(254,162,85,0.08)]">인증</button>
            </div>
            <div id="phone-code-group" style="display:none" class="mt-1 flex gap-2">
              <input id="edit-phone-code" placeholder="인증코드" class="h-[38px] w-full rounded-[8px] border border-[rgba(37,55,75,0.2)] px-3 text-[14px] outline-none" />
              <button type="button" id="phone-confirm-btn" class="shrink-0 rounded-[8px] border border-[rgba(37,55,75,0.2)] px-3 text-[13px] font-semibold text-[#25374b]">확인</button>
            </div>
            <p id="phone-status" class="mt-1 text-[12px] font-medium text-[rgba(37,55,75,0.5)]"></p>
          </div>
        </div>

        <div class="mt-3">
          <label class="text-[13px] font-semibold text-[rgba(37,55,75,0.5)]">이메일</label>
          <div class="mt-1 flex gap-2">
            <input id="edit-email" type="email" class="h-[42px] w-full rounded-[8px] border border-[rgba(37,55,75,0.2)] px-3 text-[15px] font-medium text-[#25374b] outline-none focus:border-[#fd6d4a]" />
            <button type="button" id="email-send-btn" class="shrink-0 rounded-[8px] border border-[rgba(37,55,75,0.2)] px-3 text-[13px] font-semibold text-[#25374b] hover:bg-[rgba(254,162,85,0.08)]">인증</button>
          </div>
          <div id="email-code-group" style="display:none" class="mt-1 flex gap-2">
            <input id="edit-email-code" placeholder="인증코드" class="h-[38px] w-full rounded-[8px] border border-[rgba(37,55,75,0.2)] px-3 text-[14px] outline-none" />
            <button type="button" id="email-confirm-btn" class="shrink-0 rounded-[8px] border border-[rgba(37,55,75,0.2)] px-3 text-[13px] font-semibold text-[#25374b]">확인</button>
          </div>
          <p id="email-status" class="mt-1 text-[12px] font-medium text-[rgba(37,55,75,0.5)]"></p>
        </div>

        <div id="password-section" class="mt-3">
          <button type="button" id="password-toggle-btn" class="text-[14px] font-semibold text-[#fd6d4a]">비밀번호 변경하기</button>
          <div id="password-fields" style="display:none" class="mt-2 grid grid-cols-1 gap-2 sm:grid-cols-2">
            <input id="edit-password" type="password" placeholder="새 비밀번호" class="h-[42px] w-full rounded-[8px] border border-[rgba(37,55,75,0.2)] px-3 text-[15px] outline-none" />
            <input id="edit-password-confirm" type="password" placeholder="새 비밀번호 확인" class="h-[42px] w-full rounded-[8px] border border-[rgba(37,55,75,0.2)] px-3 text-[15px] outline-none" />
          </div>
        </div>

        <p id="edit-error" class="mt-3 text-[14px] font-medium text-red-500" style="display:none"></p>
        <p id="edit-success" class="mt-3 text-[14px] font-medium text-[#22a55e]" style="display:none"></p>

        <div class="mt-4 flex gap-3">
          <button type="button" id="edit-save-btn" class="h-[46px] flex-1 rounded-[10px] bg-gradient-to-r from-[#fd6d4a] to-[#fea255] text-[16px] font-semibold text-white transition-opacity hover:opacity-90">저장하기</button>
          <a href="mypage" class="flex h-[46px] flex-1 items-center justify-center rounded-[10px] border border-[rgba(37,55,75,0.2)] text-[16px] font-medium text-[#25374b] hover:bg-[rgba(37,55,75,0.04)]">취소</a>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="assets/js/api.js"></script>
<script src="assets/js/sidebar.js"></script>
<script src="assets/js/mypage-edit.js"></script>
</body>
</html>

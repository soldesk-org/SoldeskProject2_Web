<!DOCTYPE html>
<html lang="ko" data-auth-state="guest">
<head>
<meta charset="UTF-8">
<!-- 페이지 전환 흰 번쩍임 방지(2026-08-21) — index.html의 같은 위치 주석 참고 -->
<style>html{background-color:#f8f7fb}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>잇티웨이</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/images/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
<meta name="description" content="사업자 회원가입이 완료되었습니다.">

<!--
================================================================================
 signup-business-done — 사업자 회원가입 STEP 3 (가입 완료)
--------------------------------------------------------------------------------
 (2026-08-04 전면 수정) — 사업자 계정은 STEP1(signup-business) 제출 시점에 이미 생성이 끝나 있고,
 실제로 접수번호를 발급하거나 서류 확인 진행 상태를 추적하는 백엔드 기능이 없다(회원가입 API는
 계정만 만들 뿐 별도 심사 시스템은 없음). 그래서 "심사 접수/대기 중"처럼 사실과 다른 문구 대신
 "가입 완료"로 정확하게 안내한다. #doneShopName/#doneBizNumber/#doneRequestNo/#doneRequestedAt/
 #doneExpectedAt이 있던 "접수 정보" 카드는 실제 값이 없어 signup-business-done.js가 통째로 숨긴다.
 STEP1→STEP2를 차근차근 거치지 않고 바로 들어오면 STEP1로 돌려보냅니다(2026-08-04 추가,
 sessionStorage biz_info_done_at 확인, 30분 이내만 유효).

 [출력 값]
   #doneBizEmail        담당자 이메일 (sessionStorage biz_signup_email, 유일하게 실데이터)

 [액션]
   #goBizLoginBtn       사업자 로그인 → login-business
   #goHomeLink          홈으로
================================================================================
-->

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<!-- ?v= 는 캐시 무효화용(2026-08-21) — recommend.html의 같은 위치 주석 참고 -->
<link rel="stylesheet" href="assets/css/eatty.css?v=20260821k">
<script defer src="assets/js/api.js?v=20260821c"></script>
<script defer src="assets/js/eatty-ui.js"></script>
<script defer src="assets/js/signup-business-done.js"></script>
</head>

<body class="min-h-screen flex flex-col bg-[var(--bg-soft)]">

<header class="e-header e-header--solid">
  <div class="e-container e-header-inner">
    <a href="/" class="e-logo">
      <span class="e-logo-mark" aria-hidden="true"><img src="img/logo.png" alt="잇티웨이" class="e-logo-img"></span>
      <span class="e-logo-text">잇티<em>웨이</em></span>
      <span class="e-badge e-badge--dark ml-1">BUSINESS</span>
    </a>
    <div class="e-header-actions">
      <a href="/" class="btn btn-ghost btn-sm" id="goHomeLink">홈으로</a>
    </div>
  </div>
</header>

<main class="flex-1 py-10 md:py-16 flex flex-col justify-center">
  <div class="e-container e-container-narrow">

    <div class="e-card e-card-flat p-5 mb-8">
      <div class="e-steps">
        <div class="e-step is-done">
          <span class="e-step-dot">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </span>
          <span class="e-step-label">약관 · 사업자 인증</span>
        </div>
        <span class="e-step-line" style="background:var(--brand-300)"></span>
        <div class="e-step is-done">
          <span class="e-step-dot">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </span>
          <span class="e-step-label">매장 정보</span>
        </div>
        <span class="e-step-line" style="background:var(--brand-300)"></span>
        <div class="e-step is-current">
          <span class="e-step-dot">3</span>
          <span class="e-step-label">가입 완료</span>
        </div>
      </div>
    </div>

    <!-- ======================== 완료 카드 ======================== -->
    <section class="e-card e-card-pad text-center py-12 e-anim-up">
      <span class="w-20 h-20 rounded-full grid place-items-center mx-auto mb-7 text-white" style="background:var(--brand-grad);box-shadow:var(--sh-brand)">
        <svg class="w-10 h-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </span>

      <h1 class="t-h2">가입이 완료되었어요</h1>
      <p class="t-lead mt-4 max-w-lg mx-auto">
        <b class="t-strong" id="doneBizEmail">owner@myshop.com</b> 계정으로 사업자 회원가입이 완료되었습니다.<br>
        지금 바로 사업자 로그인으로 매장을 관리할 수 있어요.
      </p>

      <!-- 접수 정보 -->
      <div class="mt-9 max-w-lg mx-auto text-left">
        <div class="e-card e-card-flat bg-[var(--bg-soft)] p-5 space-y-3">
          <div class="flex items-start justify-between gap-4">
            <span class="t-sm font-semibold flex-none">접수번호</span>
            <span class="flex items-center gap-2">
              <b class="text-sm font-extrabold text-[var(--ink-900)] t-num" id="doneRequestNo">BIZ-20260731-0148</b>
              <button type="button" class="e-icon-btn !w-7 !h-7" id="copyRequestNoBtn" aria-label="접수번호 복사">
                <svg style="width:15px;height:15px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>
              </button>
            </span>
          </div>
          <div class="flex items-start justify-between gap-4">
            <span class="t-sm font-semibold flex-none">매장명</span>
            <span class="text-sm font-bold text-[var(--ink-900)] text-right" id="doneShopName">잇티식당 강남점</span>
          </div>
          <div class="flex items-start justify-between gap-4">
            <span class="t-sm font-semibold flex-none">사업자등록번호</span>
            <span class="text-sm font-bold text-[var(--ink-900)] t-num text-right" id="doneBizNumber">123-45-67890</span>
          </div>
          <div class="flex items-start justify-between gap-4 pt-3 border-t border-[var(--line)]">
            <span class="t-sm font-semibold flex-none">접수 일시</span>
            <span class="text-sm font-bold text-[var(--ink-900)] t-num text-right" id="doneRequestedAt">2026-07-31 14:22</span>
          </div>
          <div class="flex items-start justify-between gap-4">
            <span class="t-sm font-semibold flex-none">예상 완료</span>
            <span class="text-sm font-bold text-[var(--brand-600)] t-num text-right" id="doneExpectedAt">2026-08-04 이내</span>
          </div>
        </div>
      </div>

      <div class="mt-9 flex flex-col sm:flex-row gap-3 justify-center max-w-lg mx-auto">
        <a href="login-business" class="btn btn-secondary btn-lg w-full sm:flex-1" id="goBizLoginBtn">사업자 로그인</a>
        <a href="/" class="btn btn-outline btn-lg sm:w-36">홈으로</a>
      </div>
    </section>
  </div>
</main>

<footer class="py-8 border-t border-[var(--line)] bg-white">
  <div class="e-container flex flex-wrap items-center justify-between gap-3">
    <p class="t-xs">&copy; 2026 Eatty way.</p>
    <nav class="flex gap-4 t-xs">
      <a href="terms-service" class="e-link">이용약관</a>
      <a href="terms-privacy" class="e-link">개인정보처리방침</a>
    </nav>
  </div>
</footer>

</body>
</html>

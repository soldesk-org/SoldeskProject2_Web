<!DOCTYPE html>
<html lang="ko" data-auth-state="guest">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메일을 확인해주세요 — 잇티웨이</title>
<meta name="description" content="비밀번호 재설정 링크를 이메일로 발송했습니다.">

<!--
================================================================================
 find-password-sent — 비밀번호 찾기 STEP 2 : 메일 발송 안내
--------------------------------------------------------------------------------
 [스테퍼]  #findPwSteps  (1 완료 / 2 현재 / 3·4 대기)

 [출력]  ★ 서버 값으로 채워주세요
   #sentToEmail        발송한 이메일 주소
   #linkExpireTimer    링크 유효시간 카운트다운 (data-timer="1800" = 30분)

 [액션]
   #resendResetMailBtn    재발송  ★ POST /api/auth/password/reset-request
   #changeEmailBtn        다른 이메일로 시도 → find-password
   #openMailBtn           메일 앱 열기 (mailto 또는 웹메일 링크)
================================================================================
-->

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/css/eatty.css">
<script defer src="assets/js/api.js"></script>
<script defer src="assets/js/eatty-ui.js"></script>
<script defer src="assets/js/find-password-sent.js"></script>
</head>

<body class="min-h-screen flex flex-col bg-[var(--bg-soft)]">

<header class="e-header e-header--solid">
  <div class="e-container e-header-inner">
    <a href="index" class="e-logo">
      <span class="e-logo-mark" aria-hidden="true"><img src="img/logo.png" alt="잇티웨이" class="e-logo-img"></span>
      <span class="e-logo-text">잇티<em>웨이</em></span>
    </a>
    <div class="e-header-actions">
      <a href="login" class="btn btn-outline btn-sm">로그인</a>
    </div>
  </div>
</header>

<main class="flex-1 grid place-items-center py-12 px-5">
  <div class="w-full" style="max-width:520px;min-width:0">

    <div class="e-card e-card-flat p-4 mb-5">
      <div class="e-steps" id="findPwSteps">
        <div class="e-step is-done">
          <span class="e-step-dot">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </span>
          <span class="e-step-label">이메일 입력</span>
        </div>
        <span class="e-step-line" style="background:var(--brand-300)"></span>
        <div class="e-step is-current">
          <span class="e-step-dot">2</span>
          <span class="e-step-label">메일 확인</span>
        </div>
        <span class="e-step-line"></span>
        <div class="e-step">
          <span class="e-step-dot">3</span>
          <span class="e-step-label">재설정</span>
        </div>
        <span class="e-step-line"></span>
        <div class="e-step">
          <span class="e-step-dot">4</span>
          <span class="e-step-label">완료</span>
        </div>
      </div>
    </div>

    <!-- ==================== 발송 안내 ==================== -->
    <div class="e-card e-card-pad text-center py-11 e-anim-up">
      <span class="w-[76px] h-[76px] rounded-[22px] grid place-items-center mx-auto mb-6 text-white" style="background:var(--brand-grad);box-shadow:var(--sh-brand)">
        <svg class="w-9 h-9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7.5 12 13l9-5.5"/><rect x="3" y="5" width="18" height="14" rx="2.5"/>
        </svg>
      </span>

      <h1 class="t-h3">메일을 확인해주세요</h1>
      <p class="t-lead mt-4">
        <b class="t-strong break-all" id="sentToEmail">eatty@example.com</b> 으로<br>
        비밀번호 재설정 링크를 보냈습니다.
      </p>

      <div class="mt-7 inline-flex items-center gap-2 px-4 py-2.5 rounded-[var(--r-full)]" style="background:var(--warning-soft)">
        <svg style="width:16px;height:16px;color:var(--warning)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 7v5l3.5 2"/></svg>
        <span class="text-[13px] font-bold" style="color:var(--warning-ink)">
          링크 유효시간 <span class="e-timer !text-[var(--warning-ink)]" data-timer="1800" id="linkExpireTimer">30:00</span>
        </span>
      </div>

      <div class="mt-8 flex flex-col gap-2.5">
        <a href="https://mail.google.com" target="_blank" rel="noopener" class="btn btn-primary btn-lg btn-block" id="openMailBtn">
          메일함 열기
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6M10 14 21 3"/></svg>
        </a>
        <button type="button" class="btn btn-outline btn-block" id="resendResetMailBtn">재설정 메일 재발송</button>
        <a href="find-password" class="btn btn-ghost btn-block" id="changeEmailBtn">다른 이메일로 시도</a>
      </div>
    </div>

  </div>
</main>

<footer class="py-8 border-t border-[var(--line)] bg-white">
  <div class="e-container flex flex-wrap items-center justify-between gap-3">
    <p class="t-xs">&copy; 2026 Eatty way.</p>
    <nav class="flex gap-4 t-xs">
      <a href="terms-service" class="e-link">이용약관</a>
      <a href="terms-privacy" class="e-link">개인정보처리방침</a>
    </nav>
  </div>
</footer>

</body>
</html>

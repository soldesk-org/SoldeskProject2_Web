<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>잇티웨이</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/images/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
<meta name="robots" content="noindex">

<!--
================================================================================
 error — 공통 에러 페이지 (2026-08-08 신규, 2026-08-08 2차 토스페이먼츠 스타일 리디자인)
--------------------------------------------------------------------------------
 Spring 쪽 ErrorViewResolver(ErrorViewConfig)가 HTML 요청의 /error를 이 파일로 forward한다
 (/api/** 요청은 기존 JSON 오류 응답 유지). 상태 코드는 쿼리스트링 ?status=로 넘어온다.

 디자인은 "토스페이먼츠처럼" 요청(2026-08-08)에 맞춰 카드/버튼 위주였던 1차 디자인을 완전히
 갈아엎음 — 큰 숫자 하나 + 넉넉한 여백 + 토스 블루(#0064FF) 포인트 + 은은한 그라디언트 블롭
 배경 + 필 모양 버튼의 "토스 랜딩페이지" 톤을 따른다.
================================================================================
-->

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root {
    --toss-blue: #fd6d4a;
    --toss-blue-dim: #ec5330;
    --toss-ink: #191F28;
    --toss-gray: #8B95A1;
    --toss-line: #E5E8EB;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
    background: #ffffff;
    color: var(--toss-ink);
  }
  body {
    min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 24px;
    position: relative;
    overflow: hidden;
    text-align: center;
  }

  /* 은은한 배경 블롭 두 개(토스 랜딩페이지에서 자주 쓰는 흐린 그라디언트 원) */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    opacity: .35;
    z-index: 0;
    pointer-events: none;
  }
  .blob--a { width: 420px; height: 420px; top: -160px; left: -120px; background: radial-gradient(circle, #fea255, transparent 70%); }
  .blob--b { width: 380px; height: 380px; bottom: -180px; right: -100px; background: radial-gradient(circle, #fd6d4a, transparent 70%); }

  .wrap { position: relative; z-index: 1; max-width: 460px; width: 100%; }

  .code {
    font-size: 96px;
    line-height: 1;
    font-weight: 800;
    letter-spacing: -.04em;
    background: linear-gradient(135deg, #fd6d4a 0%, #fea255 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin: 0 0 20px;
  }
  h1 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -.02em;
    margin: 0 0 12px;
    color: var(--toss-ink);
  }
  p.desc {
    font-size: 15px;
    line-height: 1.6;
    color: var(--toss-gray);
    margin: 0 0 40px;
  }

  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    height: 52px; padding: 0 28px;
    border-radius: 999px;
    font-size: 15px; font-weight: 700;
    text-decoration: none;
    transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
    border: none; cursor: pointer;
  }
  .btn--primary {
    background: linear-gradient(135deg, #fd6d4a 0%, #fea255 100%);
    color: #fff;
    box-shadow: 0 8px 20px rgba(253,109,74,.3);
  }
  .btn--primary:hover { opacity: .92; transform: translateY(-1px); }
  .btn--ghost {
    background: #F2F4F6;
    color: var(--toss-ink);
  }
  .btn--ghost:hover { background: #E9ECEF; transform: translateY(-1px); }

  @media (max-width: 420px) {
    .code { font-size: 72px; }
    h1 { font-size: 20px; }
    .btn { flex: 1; height: 50px; padding: 0 18px; }
  }
</style>
</head>
<body>
  <span class="blob blob--a" aria-hidden="true"></span>
  <span class="blob blob--b" aria-hidden="true"></span>

  <div class="wrap">
    <p class="code" id="errorCode">404</p>
    <h1 id="errorTitle">페이지를 찾을 수 없어요</h1>
    <p class="desc" id="errorDesc">주소가 잘못됐거나 삭제된 페이지예요.<br>주소를 다시 확인하시거나 홈으로 돌아가주세요.</p>

    <div class="actions">
      <a href="/" class="btn btn--primary">홈으로 가기</a>
      <a href="support" class="btn btn--ghost">고객센터 문의</a>
    </div>
  </div>

  <script>
    (function () {
      var status = null;
      try {
        var params = new URLSearchParams(location.search);
        status = params.get('status');
      } catch (e) {}
      if (!status) return;
      var map = {
        '403': ['403', '접근할 수 없어요', '이 페이지에 대한 권한이 없어요.'],
        '500': ['500', '문제가 발생했어요', '서버에 일시적인 오류가 발생했어요.<br>잠시 후 다시 시도해주세요.']
      };
      var m = map[status];
      if (!m) return;
      document.getElementById('errorCode').textContent = m[0];
      document.getElementById('errorTitle').textContent = m[1];
      document.getElementById('errorDesc').innerHTML = m[2];
    })();
  </script>
</body>
</html>

<!--
================================================================================
 settlement — 정산 카드 뽑기 (2026-08-24 신규)
--------------------------------------------------------------------------------
 참가자 이름을 최대 10명 담고, 신용카드 모양 카드를 트럼프 카드처럼 부채꼴로 펼친 뒤
 랜덤으로 한 장을 뽑아 "오늘의 계산 담당"을 정하는 화면.

 [진입 경로]
   헤더 nav "카드 뽑기"(PC) / 드로어 "카드 뽑기"(모바일·앱). 라벨은 화면 제목과 통일했다.
   ⚠️ 1024px 이상에서는 드로어가 display:none이라 **헤더 nav가 유일한 진입점**이고,
   1023px 이하에서는 헤더 nav가 숨고 드로어가 진입점이다. 둘 다 있어야 전 환경이 커버된다.
   하단 탭바는 5칸이 꽉 차 있어 넣지 않았다.

 [주요 DOM id]
   #scName / #scAddBtn        참가자 이름 입력 / 추가
   #scMsg                     입력 관련 안내(중복·최대 인원 등)
   #scNames / #scEmpty        참가자 칩 목록 / 비었을 때 안내
   #scCount                   현재 인원 수
   #scFan / #scStageEmpty     부채꼴 카드가 그려지는 곳 / 비었을 때 안내
   #scDrawBtn / #scResetBtn   랜덤 뽑기 / 전체 비우기
   #scHint                    무대 하단 상태 문구
   #scOverlay                 당첨 연출 오버레이(.e-modal 아님 — settlement.css 주석 참고)
     #scFlier                 원본 카드 위치에서 중앙으로 날아가는 복제 카드
     #scPrize                 당첨 팝업 (#scPrizeName / #scPrizeDesc)
     #scConfetti              종이꽃
     #scCloseBtn              닫기(우측 상단 X). 백드롭 탭과 Esc로도 닫힌다

 [서버]
   호출하는 API가 없다. 순수 클라이언트 기능이고 로그인도 필요 없다(roulette과 같은 성격).
   ⚠️ 확장자 없는 /settlement 로 접근하려면 PageRoutingController의 PAGES 화이트리스트에
   "settlement"가 들어 있어야 한다. 빠지면 404다. (data-nav-page 활성화도 확장자 없는
   URL을 전제로 동작한다 — eatty-ui.js는 경로 마지막 세그먼트를 그대로 비교한다.)
================================================================================
-->

<main id="mainContent" class="py-8 md:py-12">
  <div class="e-container w-full" style="max-width:880px">

    <!-- ⚠️ <br>로 줄을 강제로 끊지 않는다(2026-08-25) — 넓은 화면에서도 두 줄로 떨어져 보였다.
         폭이 부족할 때만 자연스럽게 넘어가게 두고, 그때 어디서 끊길지는 settlement.css의
         word-break: keep-all / text-wrap: balance가 정한다. -->
    <div class="sc-hero">
      <h1>오늘 계산은 누가 할까요?</h1>
      <p>정산할 사람을 담고 카드를 뽑으면 오늘의 계산 담당이 정해져요.</p>
    </div>

    <!-- ── 참가자 ──
     사이트 공통 .e-card / .btn 대신 이 페이지 전용 .sc-panel / .sc-btn을 쓴다.
     공통 버튼은 그라데이션+그림자라 토스풍 화면에서 튀고, .e-card-pad와 .e-card-head는
     여백 규칙이 겹친다(자세한 이유는 settlement.css 주석). -->
    <section class="sc-panel" aria-labelledby="scPeopleTitle">
      <div class="sc-panel-head">
        <h2 class="sc-panel-title" id="scPeopleTitle">참가자</h2>
        <span class="sc-counter"><b id="scCount">0</b> / 10</span>
      </div>

      <div class="sc-add">
        <input id="scName" class="sc-input" type="text" maxlength="12"
               placeholder="이름 입력" autocomplete="off" aria-label="참가자 이름">
        <button type="button" class="sc-btn sc-btn--dark" id="scAddBtn">추가</button>
      </div>

      <div class="sc-names" id="scNames"></div>
      <div class="sc-blank" id="scBlank">이름을 담으면 카드가 만들어져요</div>
    </section>

    <!-- ── 카드 뽑기 ── -->
    <section class="sc-panel" aria-labelledby="scDeckTitle">
      <div class="sc-panel-head">
        <h2 class="sc-panel-title" id="scDeckTitle">카드 뽑기</h2>
        <button type="button" class="sc-chip-x" id="scClearBtn" aria-label="참가자 모두 비우기"
                style="width:34px;height:34px;margin-left:auto" disabled>
          <!-- Font Awesome Free "trash" 아이콘의 실제 path(요청사항). CDN을 새로 붙이는 대신
               이 사이트의 다른 아이콘들과 같은 인라인 SVG 관용구로 넣었다 — 새 외부 의존성 없이
               404/차단 걱정도 없다. 원본 뷰박스(0 0 448 512)를 사이트가 쓰는 24x24 규격에 맞춰
               좌표만 스케일했고 path 형태는 그대로다. Font Awesome Free는 CC BY 4.0(아이콘)이라
               출처만 남기면 이렇게 형태를 가져와 써도 된다: https://fontawesome.com/license/free -->
          <!-- viewBox는 Font Awesome 원본 그대로(0 0 448 512) 두고 style로만 16px에 맞췄다 —
               좌표를 손으로 다시 계산해 옮기면 오차가 생기기 쉬워서, SVG 자체의 스케일링에 맡겼다. -->
          <svg viewBox="0 0 448 512" fill="currentColor" style="width:16px;height:16px" aria-hidden="true">
            <path d="M135.2 17.7L128 32H32C14.3 32 0 46.3 0 64S14.3 96 32 96H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H320l-7.2-14.3C307.4 6.8 296.3 0 284.2 0H163.8c-12.1 0-23.2 6.8-28.6 17.7zM416 128H32L53.2 467c1.6 25.3 22.6 45 47.9 45H346.9c25.3 0 46.3-19.7 47.9-45L416 128z"/>
          </svg>
        </button>
      </div>

      <div class="sc-stage" id="scStage">
        <p class="sc-stage-blank" id="scStageBlank">참가자를 담으면 카드가 펼쳐져요</p>
        <div class="sc-fan" id="scFan"></div>
      </div>

      <div class="sc-actions">
        <button type="button" class="sc-btn sc-btn--brand sc-btn--lg sc-btn--block" id="scDrawBtn" disabled>
          랜덤 뽑기
        </button>
      </div>
      <p class="sc-note" id="scNote">2명 이상 담아주세요</p>
    </section>

  </div>
</main>

<!-- ============================== 당첨 연출 ==============================
 .e-modal을 쓰지 않았다 — 백드롭이 카드 위를 덮어 탁해지고, 이 화면은 결과를 흰 패널이 아니라
 **카드 자체로** 보여주기 때문이다. ESC/백드롭 닫기는 settlement.js가 직접 처리한다.

 뽑힌 카드는 앞면이 위를 향한 채 중앙에 멈춘다. 이 시점에는 아직 이름이 보이지 않고,
 사용자가 카드를 눌러야 3D로 뒤집히며 뒷면 서명란에 이름이 드러난다.
-->
<div class="sc-overlay" id="scOverlay" role="dialog" aria-modal="true" aria-labelledby="scGuide" aria-hidden="true">
  <div class="sc-overlay-bg" id="scOverlayBg"></div>
  <div class="sc-confetti" id="scConfetti" aria-hidden="true"></div>

  <!-- 닫기는 우측 상단 X 하나로만 한다(2026-08-25 요청 — 하단 버튼 줄 제거).
       카드를 다시 뽑으려면 닫고 페이지의 "랜덤 뽑기"를 다시 누르면 된다. -->
  <button type="button" class="sc-close" id="scCloseBtn" aria-label="닫기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
      <path d="M18 6 6 18M6 6l12 12"/>
    </svg>
  </button>

  <p class="sc-guide" id="scGuide" role="status" aria-live="polite"></p>

  <!--
   카드(3D)와 클릭 레이어를 **분리**했다. button 요소 안에 preserve-3d 자식을 두면 일부 엔진에서
   3D가 평면화돼 뒤집기가 깨지는 경우가 있어서, 버튼은 카드 위에 겹치는 투명 히트 영역으로만 둔다.
  -->
  <!--
   .sc-flier-slot이 필요한 이유: transform(회전·확대)은 레이아웃 크기에 반영되지 않는다.
   카드는 세로 상자(160x253.5)를 가진 채 가로로 눕고 확대되므로, 슬롯이 없으면 실제 보이는
   크기보다 작은 자리만 차지해서 위아래의 안내 문구와 버튼을 카드가 덮어버린다.
   슬롯이 "보이는 크기"만큼 자리를 잡아 준다.
  -->
  <div class="sc-flier-slot">
    <div class="sc-flier" id="scFlier">
      <div class="sc-card-host" id="scCardHost"></div>
      <button type="button" class="sc-flip" id="scFlipBtn" aria-label="카드를 눌러 뽑힌 사람 확인하기"></button>
    </div>
  </div>

</div>

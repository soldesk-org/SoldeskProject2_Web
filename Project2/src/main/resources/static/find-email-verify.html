<!DOCTYPE html>
<html lang="ko" data-auth-state="guest">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>본인 인증 — 이메일 찾기 | 잇티웨이</title>
<meta name="description" content="전화번호로 전송된 인증번호를 입력해주세요.">

<!--
================================================================================
 find-email-verify.html — 이메일 찾기 STEP 2 : 전화번호 인증
--------------------------------------------------------------------------------
 [스테퍼]  #findEmailSteps  (1 완료 / 2 현재 / 3 대기)

 [출력]
   #maskedPhone           마스킹된 전화번호 (예: 010-****-5678) ★ 서버 값으로 교체

 [폼]
   #verifyCodeForm        폼 루트
   #verifyCode            인증번호 6자리 (name="code")
   #verifyCodeTimer       남은 시간 (data-timer="180")
   #verifyCodeError       인증 실패 에러
   #resendCodeBtn         인증번호 재발송  ★ POST /api/auth/sms/send
   #verifySubmitBtn       확인 → find-email-result.html
                          ★ POST /api/auth/find-email/verify

 [링크]
   #backToFindEmailLink   ← find-email.html
================================================================================
-->

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/css/eatty.css">
<script defer src="assets/js/api.js"></script>
<script defer src="assets/js/eatty-ui.js"></script>
<script defer src="assets/js/find-email-verify.js"></script>
</head>

<body class="min-h-screen flex flex-col bg-[var(--bg-soft)]">

<header class="e-header e-header--solid">
  <div class="e-container e-header-inner">
    <a href="index.html" class="e-logo">
      <span class="e-logo-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 2v7a3 3 0 0 0 6 0V2M6 12v10M17 2c-1.7 0-3 2.2-3 5s1.3 4 3 4 3-1.2 3-4-1.3-5-3-5ZM17 11v11"/>
        </svg>
      </span>
      <span class="e-logo-text">잇티<em>웨이</em></span>
    </a>
    <div class="e-header-actions">
      <a href="login.html" class="btn btn-outline btn-sm">로그인</a>
    </div>
  </div>
</header>

<main class="flex-1 grid place-items-center py-12 px-5">
  <div class="w-full" style="max-width:520px">

    <div class="text-center mb-8">
      <span class="w-14 h-14 rounded-[16px] grid place-items-center mx-auto mb-5" style="background:var(--brand-50);color:var(--brand-500)">
        <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/>
        </svg>
      </span>
      <h1 class="t-h3">본인 인증</h1>
      <p class="t-sm mt-2.5">
        <b class="t-strong t-num" id="maskedPhone">010-****-5678</b> 로<br>
        인증번호 6자리를 보냈습니다.
      </p>
    </div>

    <div class="e-card e-card-flat p-4 mb-5">
      <div class="e-steps" id="findEmailSteps">
        <div class="e-step is-done">
          <span class="e-step-dot">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </span>
          <span class="e-step-label">정보 입력</span>
        </div>
        <span class="e-step-line" style="background:var(--brand-300)"></span>
        <div class="e-step is-current">
          <span class="e-step-dot">2</span>
          <span class="e-step-label">본인 인증</span>
        </div>
        <span class="e-step-line"></span>
        <div class="e-step">
          <span class="e-step-dot">3</span>
          <span class="e-step-label">결과 확인</span>
        </div>
      </div>
    </div>

    <div class="e-card e-card-pad">
      <form id="verifyCodeForm" novalidate>

        <div class="e-field">
          <label class="e-label" for="verifyCode">
            인증번호 <span class="req">*</span>
            <span class="e-label-side">남은 시간 <span class="e-timer" data-timer="180" id="verifyCodeTimer">3:00</span></span>
          </label>
          <input type="text" class="e-input e-input-lg t-num text-center tracking-[.5em] font-extrabold"
                 id="verifyCode" name="code" placeholder="000000"
                 inputmode="numeric" maxlength="6" autocomplete="one-time-code" required>
          <p class="e-error" id="verifyCodeError">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
            인증번호가 일치하지 않습니다.
          </p>
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-block" id="verifySubmitBtn">확인</button>
      </form>

      <div class="mt-5 flex items-center justify-between">
        <p class="t-xs">인증번호를 못 받으셨나요?</p>
        <button type="button" class="e-link-brand text-[13px]" id="resendCodeBtn">재발송</button>
      </div>

      <div class="mt-6 pt-5 border-t border-[var(--line)]">
        <a href="find-email.html" class="btn btn-ghost btn-sm btn-block" id="backToFindEmailLink">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 19l-7-7 7-7"/></svg>
          정보 다시 입력하기
        </a>
      </div>
    </div>

    <div class="e-alert e-alert--info mt-5">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>
      <div>
        <p class="e-alert-title">인증번호가 오지 않는다면</p>
        <p>스팸 차단 설정 또는 수신 차단 목록을 확인해주세요. 3분이 지나면 재발송할 수 있습니다.</p>
      </div>
    </div>
  </div>
</main>

<footer class="py-8 border-t border-[var(--line)] bg-white">
  <div class="e-container flex flex-wrap items-center justify-between gap-3">
    <p class="t-xs">&copy; 2026 Eatty way.</p>
    <nav class="flex gap-4 t-xs">
      <a href="terms-service.html" class="e-link">이용약관</a>
      <a href="terms-privacy.html" class="e-link">개인정보처리방침</a>
    </nav>
  </div>
</footer>

</body>
</html>

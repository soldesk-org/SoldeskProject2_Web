<!DOCTYPE html>
<html lang="ko" data-auth-state="guest">
<head>
<meta charset="UTF-8">
<!-- 페이지 전환 흰 번쩍임 방지(2026-08-21) — index.html의 같은 위치 주석 참고 -->
<style>html{background-color:#f8f7fb}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>잇티웨이</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/images/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
<meta name="description" content="전화번호로 전송된 인증번호를 입력해주세요.">

<!--
================================================================================
 find-email-verify — 이메일 찾기 STEP 2 : 전화번호 인증
--------------------------------------------------------------------------------
 [스테퍼]  #findEmailSteps  (1 완료 / 2 현재 / 3 대기)

 [출력]
   #maskedPhone           마스킹된 전화번호 (예: 010-****-5678) ★ 서버 값으로 교체

 [폼]
   #verifyCodeForm        폼 루트
   #verifyCode            인증번호 6자리 (name="code")
   #verifyCodeTimer       남은 시간 (data-timer="180")
   ※ 인증 실패 등 에러는 Eatty.toast()로 표시합니다(2026-08-04 인라인 에러 제거).
   ※ 새로고침하거나 STEP1 없이 바로 들어오면 find-email로 돌려보냅니다(2026-08-04 추가).
   #resendCodeBtn         인증번호 재발송  ★ POST /api/auth/sms/send
   #verifySubmitBtn       확인 → find-email-result
                          ★ POST /api/auth/find-email/verify

 [링크]
   #backToFindEmailLink   ← find-email
================================================================================
-->

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<!-- ?v= 는 캐시 무효화용(2026-08-21) — recommend.html의 같은 위치 주석 참고 -->
<link rel="stylesheet" href="assets/css/eatty.css?v=20260821d">
<script defer src="assets/js/api.js?v=20260821c"></script>
<script defer src="assets/js/eatty-ui.js"></script>
<script defer src="assets/js/find-email-verify.js"></script>
</head>

<body class="min-h-screen flex flex-col bg-[var(--bg-soft)]">

<header class="e-header e-header--solid">
  <div class="e-container e-header-inner">
    <a href="/" class="e-logo">
      <span class="e-logo-mark" aria-hidden="true"><img src="img/logo.png" alt="잇티웨이" class="e-logo-img"></span>
      <span class="e-logo-text">잇티<em>웨이</em></span>
    </a>
    <div class="e-header-actions">
      <a href="login" class="btn btn-outline btn-sm">로그인</a>
    </div>
  </div>
</header>

<main class="flex-1 grid place-items-center py-12 px-5">
  <div class="w-full" style="max-width:520px">
    <div class="e-card e-card-flat p-4 mb-5">
      <div class="e-steps" id="findEmailSteps">
        <div class="e-step is-done">
          <span class="e-step-dot">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          </span>
          <span class="e-step-label">정보 입력</span>
        </div>
        <span class="e-step-line" style="background:var(--brand-300)"></span>
        <div class="e-step is-current">
          <span class="e-step-dot">2</span>
          <span class="e-step-label">본인 인증</span>
        </div>
        <span class="e-step-line"></span>
        <div class="e-step">
          <span class="e-step-dot">3</span>
          <span class="e-step-label">결과 확인</span>
        </div>
      </div>
    </div>

    <div class="e-card e-card-pad">
      <form id="verifyCodeForm" novalidate>

        <div class="e-field">
          <label class="e-label" for="verifyCode">
            인증번호 <span class="req">*</span>
            <span class="e-label-side">남은 시간 <span class="e-timer" data-timer="180" data-timer-target="#verifyCode" id="verifyCodeTimer">3:00</span></span>
          </label>
          <input type="text" class="e-input e-input-lg t-num text-center tracking-[.5em] font-extrabold"
                 id="verifyCode" name="code" placeholder="000000"
                 inputmode="numeric" maxlength="6" autocomplete="one-time-code" required>
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-block" id="verifySubmitBtn">확인</button>
      </form>

      <div class="mt-5 flex items-center justify-end">
        <p class="t-xs" style="margin-right: 12px;">인증번호를 못 받으셨나요?</p>
        <button type="button" class="e-link-brand text-[13px]" id="resendCodeBtn" style="margin-right: 10px;">재발송</button>
      </div>

      <div class="mt-6 pt-5 border-t border-[var(--line)]">
        <a href="find-email" class="btn btn-ghost btn-sm btn-block" id="backToFindEmailLink">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 19l-7-7 7-7"/></svg>
          정보 다시 입력하기
        </a>
      </div>
    </div>
  </div>
</main>

<footer class="py-8 border-t border-[var(--line)] bg-white">
  <div class="e-container flex flex-wrap items-center justify-between gap-3">
    <p class="t-xs">&copy; 2026 Eatty way.</p>
    <nav class="flex gap-4 t-xs">
      <a href="terms-service" class="e-link">이용약관</a>
      <a href="terms-privacy" class="e-link">개인정보처리방침</a>
    </nav>
  </div>
</footer>

</body>
</html>

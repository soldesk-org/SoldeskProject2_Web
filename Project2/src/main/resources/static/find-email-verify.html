<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>인증번호 입력 | 잇티웨이</title>
<link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
<div class="flex h-screen w-full overflow-hidden bg-white font-['Inter','Noto_Sans_KR',sans-serif]">
  <div class="relative flex w-full shrink-0 flex-col overflow-y-auto px-10 py-8 lg:w-[31%] lg:min-w-[440px] lg:max-w-[595px] lg:px-14">
    <a href="index" class="flex items-center gap-3">
      <div class="relative size-16 shrink-0 overflow-hidden">
        <img src="assets/images/logo-icon.png" alt="Eatty way 로고" class="absolute left-[-36.79%] top-[-24.44%] size-[173.11%] max-w-none object-cover" />
      </div>
      <span class="bg-gradient-to-r from-[#fd6d4a] to-[#fea255] bg-clip-text text-[36px] font-bold tracking-[-1.8px] text-transparent">Eatty way</span>
    </a>

    <div class="flex flex-1 flex-col justify-center py-8">
      <div class="text-[#25374b]">
        <h1 class="text-[30px] font-semibold leading-tight tracking-[-1.5px]">인증번호를 입력해주세요.</h1>
        <p class="mt-3 text-[18px] font-medium leading-normal tracking-[-0.9px] opacity-80">전송된 6자리 인증번호를 입력해주세요.</p>
      </div>

      <div class="mt-8 flex flex-col gap-2">
        <label class="text-[18px] font-medium tracking-[-0.9px] text-[#25374b]">전화번호</label>
        <div id="fev-phone" class="flex h-[52px] w-full items-center rounded-[10px] bg-[rgba(37,55,75,0.1)] px-6 text-[18px] font-medium tracking-[-0.9px] text-[rgba(37,55,75,0.7)]"></div>
      </div>

      <div class="mt-6 flex flex-col gap-2">
        <label class="text-[18px] font-medium tracking-[-0.9px] text-[#25374b]">인증번호</label>
        <div class="flex items-center gap-2">
          <input class="otp-input h-[52px] w-full flex-1 rounded-[10px] border border-[rgba(37,55,75,0.7)] bg-[rgba(255,255,255,0.15)] text-center text-[20px] font-medium text-[#25374b] outline-none focus:border-[#fd6d4a]" inputmode="numeric" maxlength="1" />
          <input class="otp-input h-[52px] w-full flex-1 rounded-[10px] border border-[rgba(37,55,75,0.7)] bg-[rgba(255,255,255,0.15)] text-center text-[20px] font-medium text-[#25374b] outline-none focus:border-[#fd6d4a]" inputmode="numeric" maxlength="1" />
          <input class="otp-input h-[52px] w-full flex-1 rounded-[10px] border border-[rgba(37,55,75,0.7)] bg-[rgba(255,255,255,0.15)] text-center text-[20px] font-medium text-[#25374b] outline-none focus:border-[#fd6d4a]" inputmode="numeric" maxlength="1" />
          <input class="otp-input h-[52px] w-full flex-1 rounded-[10px] border border-[rgba(37,55,75,0.7)] bg-[rgba(255,255,255,0.15)] text-center text-[20px] font-medium text-[#25374b] outline-none focus:border-[#fd6d4a]" inputmode="numeric" maxlength="1" />
          <input class="otp-input h-[52px] w-full flex-1 rounded-[10px] border border-[rgba(37,55,75,0.7)] bg-[rgba(255,255,255,0.15)] text-center text-[20px] font-medium text-[#25374b] outline-none focus:border-[#fd6d4a]" inputmode="numeric" maxlength="1" />
          <input class="otp-input h-[52px] w-full flex-1 rounded-[10px] border border-[rgba(37,55,75,0.7)] bg-[rgba(255,255,255,0.15)] text-center text-[20px] font-medium text-[#25374b] outline-none focus:border-[#fd6d4a]" inputmode="numeric" maxlength="1" />
        </div>
      </div>

      <p id="fev-error" class="mt-2 text-[15px] font-medium text-red-500" style="display:none"></p>
      <div class="mt-6">
        <button type="button" id="fev-confirm-btn" class="flex h-[52px] w-full items-center justify-center rounded-[10px] bg-gradient-to-r from-[#fd6d4a] to-[#fea255] text-[20px] font-semibold tracking-[-1px] text-white transition-opacity hover:opacity-90">확인</button>
      </div>

      <div class="mt-4 flex items-center justify-between text-[18px] font-medium tracking-[-0.9px] text-[rgba(37,55,75,0.7)]">
        <span>인증번호를 받지 못하셨나요?</span>
        <button type="button" id="fev-resend-btn">재전송</button>
      </div>

      <div class="mt-6">
        <a href="login" class="relative flex h-[52px] w-full items-center justify-center rounded-[10px] border border-[rgba(37,55,75,0.7)] bg-white text-[18px] font-medium tracking-[-0.9px] text-[rgba(37,55,75,0.7)] transition-colors hover:bg-[rgba(37,55,75,0.04)]">
          <span class="absolute left-6 top-1/2 -translate-y-1/2 text-[20px]">‹</span>
          로그인으로 돌아가기
        </a>
      </div>
    </div>
  </div>

  <div class="relative hidden flex-1 lg:block">
    <img src="assets/images/map.png" alt="맛집 지도" class="absolute inset-0 size-full object-cover" />
  </div>
</div>
<script src="assets/js/api.js"></script>
<script src="assets/js/otp.js"></script>
<script src="assets/js/find-email-verify.js"></script>
</body>
</html>

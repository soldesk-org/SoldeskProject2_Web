spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: Project2

  mvc:
    # favicon.ico 캐싱(2026-08-14 추가) — Spring Boot가 기본으로 등록하는 파비콘 핸들러가 우리
    # StaticResourceConfig의 Cache-Control 설정보다 우선 적용돼서 캐싱이 안 먹히고 있었다. 기본 핸들러를
    # 끄고 우리 핸들러만 쓰게 한다.
    favicon:
      enabled: false

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    # SQL 로그를 껐다(2026-08-05) — 콘솔에 매 요청마다 쿼리가 계속 찍혀서 실제 에러 스택트레이스가
    # 묻히는 문제가 있었음. 쿼리 확인이 필요하면 이 값만 잠깐 true로 바꿔서 쓴다.
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

  mail:
    host: smtp.daum.net
    port: 465
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          timeout: 5000

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      # 2026-08-09 추가 — 명시하지 않으면 Lettuce 기본값(1분)이 적용돼서, Redis가 응답 없을 때
      # 로그인/소셜로그인 요청이 최대 1분씩 멈춰있다가 실패했다(VM 예약 종료 이후 Redis 컨테이너가
      # 늦게 복구된 날 실제로 겪음). 짧게 잡아서 Redis 장애 시 사용자가 오래 기다리지 않고
      # 바로 오류를 받게 한다.
      # 2026-08-10 — 3초는 순간적인 네트워크 지연에는 너무 빡빡했다(Redis 자체는 매번 수십ms 안에
      # 응답하는데도 커넥션이 한 번 꼬이면 그 요청 하나가 3초 만에 타임아웃 나던 상황) — 5초로 완화.
      # 진짜 근본 원인은 타임아웃 값이 아니라 아래 풀 설정(커넥션 하나가 꼬여도 재사용 안 하고 버림)이라
      # 타임아웃을 너무 길게 늘리진 않는다(장애 시 사용자를 오래 기다리게 하는 게 더 나쁨).
      timeout: 5000
      lettuce:
        pool:
          # commons-pool2 추가(pom.xml)로 활성화 — 커넥션을 하나만 계속 재사용하지 않고 풀로 관리해서,
          # 타임아웃 등으로 죽은 커넥션이 있어도 빌려주기 전에 검증(test-on-borrow)해서 걸러낸다.
          # 오늘 실제로 겪은 "한 번 타임아웃 나면 재기동 전까지 이후 모든 요청이 계속 실패" 문제의
          # 근본 해결책.
          enabled: true
          max-active: 8
          max-idle: 8
          min-idle: 1
          test-on-borrow: true
          test-while-idle: true
          time-between-eviction-runs: 30000

  servlet:
    multipart:
      # 사업자등록증명원 PDF/이미지 업로드용. 기본값(1MB)으로는 스캔 PDF가 거의 다 걸려서 상향.
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:14}
  # 로그인 상태 유지 체크박스를 껐을 때(또는 생략 시) 적용되는 짧은 세션(2026-07-19 요구사항 추가).
  refresh-expiration-hours-short: ${JWT_REFRESH_EXPIRATION_HOURS_SHORT:24}

member:
  cleanup:
    unverified-after-hours: ${MEMBER_CLEANUP_UNVERIFIED_AFTER_HOURS:24}
    cron: ${MEMBER_CLEANUP_CRON:0 0 * * * *}

phone-crypto:
  aes-key: ${PHONE_AES_KEY}
  hash-key: ${PHONE_HASH_KEY}

password-reset:
  # 기본값이 예전에 별도 Vite 프론트(5173)를 쓰려고 했을 때 남은 값이었음 — 이 프로젝트는 정적 리소스를
  # Spring Boot(8081)가 직접 서빙하고, 실제 재설정 화면은 find-password-reset.html이다(2026-08-04 수정).
  frontend-url: ${PASSWORD_RESET_FRONTEND_URL:http://localhost:8081/find-password-reset}

mail-sender:
  # Daum SMTP는 인증 아이디(spring.mail.username, 도메인 없는 "eattyway")와
  # 메일 From 헤더에 표시할 실제 주소가 다르므로 분리해서 관리한다.
  from-address: ${MAIL_FROM_ADDRESS:eattyway@daum.net}

ppurio:
  # 2026-07-20: 공식 API 문서(message.ppurio.com) 기준으로 갱신 — 예전에 참고했던 api.bizppurio.com 문서는
  # 구버전이었음(엔드포인트/요청·응답 필드가 다름, SMS-인증-Ppurio-연동-가이드.md 참고).
  base-url: ${PPURIO_BASE_URL:https://message.ppurio.com}
  account: ${PPURIO_ACCOUNT:}
  auth-key: ${PPURIO_AUTH_KEY:}
  sender-number: ${PPURIO_SENDER_NUMBER:07052364828}

sms:
  test-mode:
    # 로컬 테스트용(2026-08-04 추가) — true면 실제 SMS 발송(뿌리오 비용 발생) 없이 인증번호가 항상
    # 000000으로 고정된다. 기본값 false, 각자 로컬 .env에서만 켜서 쓰는 opt-in 설정(팀 공용 값 아님).
    enabled: ${SMS_TEST_MODE_ENABLED:false}

# Azure Blob Storage 마이그레이션(2026-08-18 추가) — 아래 profile-image/restaurant-image/receipt-image/
# review-image 4개 블록이 지금까지처럼 로컬 디스크(upload-dir/base-url)에 저장할지, Azure Blob Storage에
# 저장할지를 여기 image-storage.backend 하나로 전부 결정한다(값: local 또는 azure-blob). 기본값은 local —
# 운영 VM에 이미 로컬 파일이 쌓여 있고, 팀이 실제로 전환하기로 확정하기 전까지는 기존 배포도 이 워크트리도
# 지금까지와 완전히 같게 동작해야 하기 때문(안전한 기본값을 먼저 두고, 필요할 때만 opt-in — 이 프로젝트가
# 계속 지켜온 원칙). azure-blob으로 켜도 azure-storage.account-url이 비어있으면 서버는 정상 기동하고,
# 실제로 이미지 업로드/삭제가 호출되는 순간에만 AZURE_STORAGE_NOT_CONFIGURED로 명확하게 실패한다(다른
# 선택적 외부 연동과 동일한 원칙 — business-verify.internal-token, PARKING_DATA_SERVICE_KEY 등 참고).
image-storage:
  backend: ${IMAGE_STORAGE_BACKEND:local}

azure-storage:
  # 2026-08-18 2차 수정 — 원래는 연결 문자열(계정 키) 방식이었는데, 이 구독에 "로컬 인증(키) 금지,
  # Azure AD만 허용" 정책이 걸려있어 실제로는 전부 거부됐다(docs/00.공통/인프라/
  # Azure-Blob-Storage-이미지저장-가이드.md 참고). VM의 관리 ID(Managed Identity)로 인증하는 방식으로
  # 바꿔서, 계정 키 대신 그냥 스토리지 계정의 엔드포인트 URL만 있으면 된다(형식:
  # https://{계정명}.blob.core.windows.net). 컨테이너 이름(profile-images/restaurant-images/
  # receipt-images/review-images)은 4개 *ImageStorageService에 고정값으로 두었다 — 기존 로컬
  # upload-dir 폴더 이름과 1:1로 대응시켜 헷갈리지 않게 함. 비어있으면(기본값) azure-blob backend를
  # 실제로 쓰려는 시점에만 에러가 난다 — 위 image-storage.backend 설명 참고.
  account-url: ${AZURE_STORAGE_ACCOUNT_URL:}
  # 2026-08-21 추가 — Azure CDN/Front Door로 자체 도메인(예: images.eattyway.com)을 스토리지 앞단에
  # 붙였을 때, 업로드 응답 URL의 호스트를 그 도메인으로 내보내기 위한 값(형식: https://images.eattyway.com,
  # 끝에 슬래시 없이). 비어있으면(기본값) 지금처럼 원본 blob.core.windows.net URL을 그대로 쓴다 — CDN을
  # 아직 안 붙인 환경도 그대로 동작해야 한다는 원칙(account-url과 동일).
  public-base-url: ${AZURE_STORAGE_PUBLIC_BASE_URL:}

profile-image:
  # backend가 local일 때만 실제로 쓰이는 로컬 디스크 저장 설정(과거 업로드 파일의 삭제 판별에도 항상 쓰임 —
  # 각 *ImageStorageService.delete()가 이 baseUrl로 시작하는 URL을 로컬 파일로 우선 판별한다).
  upload-dir: ${PROFILE_IMAGE_UPLOAD_DIR:./uploads/profile-images}
  base-url: ${PROFILE_IMAGE_BASE_URL:http://localhost:8081/profile-images}
  # 사진을 등록하지 않은 회원에게 보여줄 기본 프로필 이미지 URL. 실제 이미지 자산은 아직 정해지지 않아
  # 의도적으로 비워둠 — 값이 비어있으면 profileImageUrl 응답 필드는 null로 내려간다(추후 값만 채우면 됨).
  default-url: ${PROFILE_IMAGE_DEFAULT_URL:}
  max-size-bytes: ${PROFILE_IMAGE_MAX_SIZE_BYTES:5242880}

restaurant:
  # 음식점 사진을 등록하지 않았을 때(사업자 등록 기능은 아직 없어 항상 이 경우임) 보여줄 기본 이미지 URL.
  # profile-image.default-url과 같은 패턴 — 실제 이미지 자산 미정이라 의도적으로 비워둠, 비어있으면
  # imageUrl 응답 필드는 null로 내려간다.
  default-image-url: ${RESTAURANT_DEFAULT_IMAGE_URL:}

restaurant-image:
  # 사업자 등록(2026-07-20 추가) 음식점 사진 업로드 — profile-image와 완전히 같은 로컬 디스크 저장 패턴.
  upload-dir: ${RESTAURANT_IMAGE_UPLOAD_DIR:./uploads/restaurant-images}
  base-url: ${RESTAURANT_IMAGE_BASE_URL:http://localhost:8081/restaurant-images}
  max-size-bytes: ${RESTAURANT_IMAGE_MAX_SIZE_BYTES:5242880}

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8081/api/oauth-providers/kakao/callback}
  naver:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}
    redirect-uri: ${NAVER_REDIRECT_URI:http://localhost:8081/api/oauth-providers/naver/callback}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8081/api/oauth-providers/google/callback}
  # 소셜로그인 콜백(/api/oauth-providers/{provider}/callback, REST 라우팅 전면개편 2026-08-14로 경로 변경)
  # 처리 완료 후 302로 리다이렉트할 프론트 주소(2026-07-21 추가).
  # login.js의 handleOAuthRedirectParams()가 쿼리스트링(accessToken/refreshToken/memberId 또는 error)을 처리한다.
  frontend-redirect-url: ${OAUTH_FRONTEND_REDIRECT_URL:http://localhost:8081/login}

business-verify:
  # 사업자등록증명원 OCR+원본확인+진위확인 + 영수증 OCR(08 영수증OCR, 2026-07-21) Python(FastAPI) 서버.
  # SoldeskProject2_Python/receipt-biz-verify 참고 — 이 프로젝트 저장소 밖에서 별도로(uvicorn) 기동해야
  # 하며, 기본 포트 8000을 가정한다. 영수증 OCR(ReceiptOcrClient)도 같은 서버의 다른 라우터라 이 설정을
  # 그대로 재사용한다(별도 receipt-ocr.base-url을 만들지 않음).
  base-url: ${BUSINESS_VERIFY_BASE_URL:http://localhost:8000}
  # api.eattyway.com이 인터넷에 그대로 노출돼 있어 악의적인 사용자가 직접(우리 백엔드를 거치지 않고)
  # /parse-receipt·/verify를 호출해서 Gemini/Upstage/국세청 API 호출량을 소모시킬 수 있다(2026-08-08
  # 사용자 지적). Python 서버(main.py)가 이 값과 같은 X-Internal-Token 헤더가 없으면 /health를 포함한
  # 모든 요청을 401로 거부하도록 미들웨어를 추가했고, 여기서는 그 헤더를 실어 보낸다. 값이 비어있으면
  # (로컬 개발 중 아직 안 정했을 때) 헤더 자체를 안 보내고, Python 쪽도 토큰이 설정 안 돼 있으면 검사를
  # 건너뛰어(fail-open) 로컬 개발을 막지 않는다 — 운영(VM)에서만 반드시 채워야 한다.
  internal-token: ${BUSINESS_VERIFY_INTERNAL_TOKEN:}

receipt-image:
  # 영수증 이미지(08 영수증OCR, 2026-07-21 추가) — profile-image/restaurant-image와 동일한 로컬 디스크
  # 저장 패턴.
  upload-dir: ${RECEIPT_IMAGE_UPLOAD_DIR:./uploads/receipt-images}
  base-url: ${RECEIPT_IMAGE_BASE_URL:http://localhost:8081/receipt-images}
  max-size-bytes: ${RECEIPT_IMAGE_MAX_SIZE_BYTES:5242880}

review-image:
  # 리뷰 사진(2026-08-10 추가) — profile-image/restaurant-image/receipt-image와 동일한 로컬 디스크 저장 패턴.
  upload-dir: ${REVIEW_IMAGE_UPLOAD_DIR:./uploads/review-images}
  base-url: ${REVIEW_IMAGE_BASE_URL:http://localhost:8081/review-images}
  max-size-bytes: ${REVIEW_IMAGE_MAX_SIZE_BYTES:5242880}

parking-data:
  # 인근 유료주차장 정보(15.주차장-정보, 2026-07-23 추가) — 공공데이터포털 "한국교통안전공단_주차정보
  # 제공 API"(서비스 B553881/Parking). 반경 검색을 지원하지 않아 배치 동기화 후 우리 DB에서 직접 거리
  # 계산하는 구조(docs/15.주차장-정보/001-02 참고). 이 API는 활용신청 심의승인이 필요해서 키가 없으면
  # 동기화가 조용히 건너뛰어진다(nearby 조회 자체는 그냥 빈 배열, PARKING_DATA_SERVICE_UNAVAILABLE 없음).
  #
  # (2026-07-27 — 전국 176만여 건(중복 다수)에 반경검색 불가, 시간대에 따라 원인불명의 -999 에러까지 겹쳐
  # 아래 seoul-parking-data(서울 열린데이터광장)로 전환. 이 설정과 관련 스케줄러/클라이언트 코드는 삭제하지
  # 않고 남겨둠 — 나중에 전국 단위로 다시 필요해지면 되돌릴 수 있게.)
  base-url: ${PARKING_DATA_BASE_URL:http://apis.data.go.kr/B553881/Parking}
  service-key: ${PARKING_DATA_SERVICE_KEY:}
  # 2차 추가(2026-07-23) — 관리자 수동 트리거 대신 자동 동기화(ParkingSyncScheduler): 서버 기동 직후
  # 1회(데이터가 하나도 없을 때만) + 매일 새벽 3시 정기 실행. 관리자 API는 즉시 강제 재동기화용으로 유지.
  sync-cron: ${PARKING_DATA_SYNC_CRON:0 0 3 * * *}
  sync-max-pages: ${PARKING_DATA_SYNC_MAX_PAGES:50}

seoul-parking-data:
  # 인근 유료주차장 정보 2차 전환(2026-07-27) — 서울 열린데이터광장 "서울시 주차장 정보"(GetParkInfo).
  # 서울시 전체 2,189건(위경도 채워진 건 약 1,456건)으로 규모가 작아, DB 동기화 없이 검색할 때마다 전체를
  # 실시간으로 가져와(최대 1000건씩 3번) 우리 서버에서 Haversine 거리 계산으로 직접 거른다
  # (docs/15.주차장-정보 참고, ParkingDataClient/ParkingSyncService와 별도 경로).
  base-url: ${SEOUL_PARKING_BASE_URL:http://openapi.seoul.go.kr:8088}
  service-key: ${SEOUL_PARKING_SERVICE_KEY:}

ncp-directions:
  # 길찾기(2026-07-27 신규) — NCP(네이버클라우드플랫폼) Maps "Direction 5"(자동차 길찾기) API. 지도
  # 렌더링에 쓰는 공개 ncpKeyId(프론트 maps.js 스크립트 태그, i99edc9due)와 달리, 이건 서버에서만 쓰는
  # Client ID/Secret 쌍으로 인증한다(X-NCP-APIGW-API-KEY-ID / X-NCP-APIGW-API-KEY 헤더). 소요시간/거리/
  # 통행료/택시요금과 경로 좌표(path)를 응답으로 준다 — docs/16.길찾기 참고.
  base-url: ${NCP_DIRECTIONS_BASE_URL:https://maps.apigw.ntruss.com/map-direction/v1/driving}
  client-id: ${NCP_MAPS_CLIENT_ID:}
  client-secret: ${NCP_MAPS_CLIENT_SECRET:}

ncp-geocoding:
  # 사업자 회원가입 STEP2 주소 검색(2026-08-04 신규) — 도로명주소 문자열을 좌표로 변환하는 NCP Maps의
  # 다른 서브 API(같은 Client ID/Secret 재사용, ncp-directions 설정 참고).
  base-url: ${NCP_GEOCODING_BASE_URL:https://maps.apigw.ntruss.com/map-geocode/v2/geocode}

hyperclova:
  # AI 고객센터 챗봇(2026-07-31 신규) — 네이버클라우드플랫폼(NCP) CLOVA Studio의 HyperCLOVA X Chat
  # Completions API. 서버 전용 API 키(Authorization: Bearer)로 인증하며, 잇티웨이 서비스 안내를
  # 시스템 프롬프트로 고정해서 고객센터 문의 응대 용도로만 쓴다 - docs/25.AI고객센터챗봇 참고.
  # 키가 없으면(로컬에서 발급 전) SUPPORT_CHAT_SERVICE_UNAVAILABLE로 응답하고 앱 기동 자체는 막지 않는다.
  base-url: ${HYPERCLOVA_BASE_URL:https://clovastudio.stream.ntruss.com}
  model: ${HYPERCLOVA_MODEL:HCX-DASH-002}
  api-key: ${HYPERCLOVA_API_KEY:}

support-chat-log:
  # AI 고객센터 챗봇 대화 로그(2026-07-31 2차 추가) — 질문/답변을 JSON Lines 파일로 남기되, phone-crypto와
  # 같은 AES-256-GCM 방식으로 대화 내용(question/answer)만 암호화해서 저장한다(세션ID/시각은 평문).
  # 키가 없으면(아직 Jenkins Credentials 미등록 등) 로그 기록 자체를 건너뛰고 앱 기동은 막지 않는다
  # (HYPERCLOVA_API_KEY와 같은 방어적 설계) — docs/25.AI고객센터챗봇 참고.
  aes-key: ${CHAT_LOG_AES_KEY:}
  log-file: ${CHAT_LOG_FILE_PATH:./logs/support-chat.jsonl}

recommendation:
  # AI 추천(2026-07-22 추가) — 다른 팀원이 만든 Python(FastAPI) 서버 recommendation_api.py.
  # SoldeskProject2_Python/keyword-extraction 참고, run_recommendation_api.cmd로 기본 포트 8000에 기동.
  # business-verify와 기본 포트가 같은 8000인데, 이 둘은 서로 다른 Python 프로젝트라 실제로는 한 번에
  # 하나씩만 켜서 테스트하는 걸 전제로 한다 — 둘 다 동시에 필요해지면 이 값을 다른 포트로 바꿔서 기동해야 함.
  base-url: ${RECOMMENDATION_BASE_URL:http://localhost:8000}
  # ai.eattyway.com도 인터넷에 그대로 노출돼 있어 토큰 없이 직접 호출하면 GPU LLM 추론과 카카오 API
  # 호출량이 낭비될 수 있다(2026-08-08 확인) — business-verify.internal-token과 같은 방식.
  internal-token: ${RECOMMENDATION_INTERNAL_TOKEN:}

# HTTPS 로컬/팀 테스트용 추가 커넥터(13.HTTPS-전송암호화, 2026-07-23 추가) — 기존 HTTP 포트(8081, 소셜로그인
# 콜백 등록 URL과의 호환 유지)는 그대로 두고, 같은 애플리케이션에 TLS 커넥터를 하나 더 연다.
# HttpsConnectorConfig 참고. keystore 파일은 각자 로컬에서 생성해야 함(docs/13.HTTPS-전송암호화/001-04 참고,
# 커밋되지 않음). 팀원 로컬에 keystore가 없으면 HTTPS_CONNECTOR_ENABLED=false로 끄면 기존과 동일하게 동작.
https-connector:
  enabled: ${HTTPS_CONNECTOR_ENABLED:false}
  port: ${HTTPS_CONNECTOR_PORT:8443}
  key-store: ${SSL_KEY_STORE:./keystore/localhost.p12}
  key-store-password: ${SSL_KEY_STORE_PASSWORD:}
  key-store-type: ${SSL_KEY_STORE_TYPE:PKCS12}
  key-alias: ${SSL_KEY_ALIAS:localhost}

server:
  port: 8081
  # nginx가 X-Forwarded-Proto로 원래 스킴(https)을 넘겨주는데, 이 설정이 없으면 Spring이 그걸 무시하고
  # "redirect:" 응답을 항상 http://로 내려버린다("/index" → "/" 리다이렉트에서 2026-08-08 실제로 발견).
  forward-headers-strategy: framework
